name: Validate and publish public documentation

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - package.json
      - package-lock.json
      - contracts/**
      - docs/**
      - scripts/**
      - tests/public-message-promotion.test.ts
      - tests/repo-hygiene.test.ts
      - .github/workflows/docs-cloudflare-pages.yml
      - .github/workflows/public-message-promotion.yml
  push:
    branches:
      - develop
      - main
    paths:
      - docs/manual/**
      - docs/.vitepress/**
      - docs/publication/public-message.json
      - docs/publication/organization-teaser.json
      - package.json
      - package-lock.json
      - .github/workflows/docs-cloudflare-pages.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated main build to Cloudflare Pages
        required: true
        type: boolean
        default: false
      sync_service_jwt:
        description: Sync BRAINBASE_SERVICE_JWT to brainbase-tenant-runtime
        required: true
        type: boolean
        default: false
      expected_account_id:
        description: Exact Cloudflare account ID safety check for secret sync
        required: false
        type: string

concurrency:
  group: brainbase-public-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-publish:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, wsl-linux, nucbox-evo-x2]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # deploy=true on main checks out github.sha, the same commit as --commit-hash and readback.
          # Any other workflow_dispatch still checks out main and must not deploy.
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy == true && github.ref == 'refs/heads/main' && github.sha || 'main') || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate public-message projections and documentation
        run: npm run docs:check

      - name: Run publication contract tests
        run: npx vitest run tests/public-message-promotion.test.ts tests/repo-hygiene.test.ts

      - name: Build VitePress site
        run: npm run docs:build

      - name: Smoke-test built HTML
        run: npm run docs:smoke

      - name: Validate bounded Worker secret target
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_service_jwt == true }}
        env:
          EXPECTED_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRAINBASE_SERVICE_JWT: ${{ secrets.BRAINBASE_SERVICE_JWT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$BRAINBASE_SERVICE_JWT"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"

      - name: Sync and verify Worker service token
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_service_jwt == true }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRAINBASE_SERVICE_JWT: ${{ secrets.BRAINBASE_SERVICE_JWT }}
        run: |
          set -euo pipefail
          printf '%s' "$BRAINBASE_SERVICE_JWT" | npx --yes wrangler@4.37.1 secret put BRAINBASE_SERVICE_JWT --name brainbase-tenant-runtime
          npx --yes wrangler@4.37.1 secret list --name brainbase-tenant-runtime | jq -e 'any(.[]; .name == "BRAINBASE_SERVICE_JWT")'

      - name: Decide whether to deploy
        id: deployment
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          MANUAL_DEPLOY: ${{ inputs.deploy }}
        run: node scripts/cloudflare-pages-production.mjs decide-deploy

      - name: Require Cloudflare deployment credentials
        if: ${{ steps.deployment.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN is not configured" >&2
            exit 1
          }

      - name: Resolve Cloudflare Pages production branch
        id: pages_production
        if: ${{ steps.deployment.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          branch="$(node scripts/cloudflare-pages-production.mjs print-branch)"
          printf 'production_branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy verified build to Cloudflare Pages
        id: pages_deploy
        if: ${{ steps.deployment.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # pages-deployment-id requires wrangler >= 3.81. Pin so a preinstalled wrangler cannot drop it.
          wranglerVersion: "3.90.0"
          command: pages deploy docs/.vitepress/dist --project-name=brainbase --branch=${{ steps.pages_production.outputs.production_branch }} --commit-hash=${{ github.sha }} --commit-dirty=true

      - name: Require a production Pages deployment
        if: ${{ steps.deployment.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PAGES_DEPLOYMENT_ID: ${{ steps.pages_deploy.outputs.pages-deployment-id }}
        run: node scripts/cloudflare-pages-production.mjs assert-deployment "$PAGES_DEPLOYMENT_ID" "$EXPECTED_COMMIT_SHA"

      # Readback stays immediately after the production deploy. Run 40817994386
      # printed a preview alias and left https://brainbase.pages.dev unchanged;
      # npm publish finishing later does not promote that preview.
      # Judge only this run's deployment id. An older preview of the same commit is not this deployment.
      - name: Read back the public site
        if: ${{ steps.deployment.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          BRAINBASE_PUBLIC_URL: https://brainbase.pages.dev
          PUBLIC_READBACK_ATTEMPTS: '18'
          PUBLIC_READBACK_DELAY_MS: '5000'
        run: npm run docs:verify-public

      - name: Summarize failed or cancelled documentation validation
        if: ${{ always() && (failure() || cancelled()) }}
        run: |
          {
            echo '## Documentation CI failure/cancellation summary'
            echo
            echo '- Protection: docs contracts, publication contracts, VitePress build, smoke check, a Cloudflare Pages production deployment (not a preview alias), and required post-deploy public readback of https://brainbase.pages.dev.'
            echo '- Reproduce: `npm ci --ignore-scripts && npm run docs:check && npx vitest run tests/public-message-promotion.test.ts tests/repo-hygiene.test.ts && npm run docs:build && npm run docs:smoke`.'
            echo '- Expected: validation passes before a deploy. A main push, or workflow_dispatch with deploy=true from refs/heads/main, checks out that same commit, deploys it to the project production branch, requires environment=production on the deployment id created by this run, and passes `docs:verify-public` for that same SHA. workflow_dispatch deploy=true from any other ref fails before deploy. A develop push does not deploy.'
            echo '- Unknown: inspect the failed step. A preview alias does not update the production hostname. If deployment or readback failed, the public site state requires a fresh production deploy and readback.'
          } >> "$GITHUB_STEP_SUMMARY"
