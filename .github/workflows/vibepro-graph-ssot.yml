name: VibePro Graph SSOT Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'session/**']
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  pr-graph-ssot:
    if: github.event_name == 'pull_request'
    name: Verify VibePro Graph SSOT before merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BRAINBASE_GRAPH_API_URL: https://bb.unson.jp
      BRAINBASE_ROLE: gm
      BRAINBASE_PROJECTS: brainbase
      BRAINBASE_CLEARANCE: internal,restricted,finance,hr,contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run Graph SSOT checker unit tests
        run: npm run test:run -- tests/unit/vibepro-graph-ssot-check.test.js

      - name: Verify Ontology release integrity
        env:
          ONTOLOGY_PUBLICATION_SIGNING_PUBLIC_KEY: ${{ secrets.ONTOLOGY_PUBLICATION_SIGNING_PUBLIC_KEY }}
        run: npm run ontology:verify -- --base "${{ github.event.pull_request.base.sha || github.event.before || github.sha }}" --head "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Require Graph API token
        env:
          BRAINBASE_GRAPH_API_TOKEN: ${{ secrets.BRAINBASE_GRAPH_API_TOKEN }}
        run: |
          if [ -z "$BRAINBASE_GRAPH_API_TOKEN" ]; then
            echo "BRAINBASE_GRAPH_API_TOKEN secret is required for VibePro Graph SSOT verification."
            exit 1
          fi

      - name: Verify VibePro Graph SSOT
        env:
          BRAINBASE_GRAPH_API_TOKEN: ${{ secrets.BRAINBASE_GRAPH_API_TOKEN }}
        run: npm run vibepro:graph-ssot

  post-merge-ontology:
    if: github.event_name == 'push'
    name: Verify Ontology after push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify Ontology release integrity after push
        env:
          ONTOLOGY_PUBLICATION_SIGNING_PUBLIC_KEY: ${{ secrets.ONTOLOGY_PUBLICATION_SIGNING_PUBLIC_KEY }}
        run: npm run ontology:verify -- --base "${{ github.event.before }}" --head "${{ github.sha }}"

  scheduled-graph-ssot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Verify scheduled VibePro Graph SSOT drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BRAINBASE_GRAPH_API_URL: https://bb.unson.jp
      BRAINBASE_ROLE: gm
      BRAINBASE_PROJECTS: brainbase
      BRAINBASE_CLEARANCE: internal,restricted,finance,hr,contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Require Graph API token
        env:
          BRAINBASE_GRAPH_API_TOKEN: ${{ secrets.BRAINBASE_GRAPH_API_TOKEN }}
        run: |
          if [ -z "$BRAINBASE_GRAPH_API_TOKEN" ]; then
            echo "BRAINBASE_GRAPH_API_TOKEN secret is required for VibePro Graph SSOT verification."
            exit 1
          fi

      - name: Verify VibePro Graph SSOT
        env:
          BRAINBASE_GRAPH_API_TOKEN: ${{ secrets.BRAINBASE_GRAPH_API_TOKEN }}
        run: npm run vibepro:graph-ssot
