name: Retired state boundary

on:
  pull_request:
    paths:
      - '.github/workflows/retired-state-boundary.yml'
      - 'lib/**'
      - 'server/bootstrap/**'
      - 'server/controllers/state-controller.js'
      - 'server/routes/**'
      - 'setup.sh'
      - 'scripts/setup.sh'
      - 'scripts/check-worktree.sh'
      - 'scripts/session-runtime/**'
      - 'tests/server/bootstrap/development-runtime-boundary.test.js'
      - 'tests/server/routes/retired-capability.test.js'
      - 'tests/server/routes/brainbase.test.js'
      - 'tests/server/scripts/retired-setup.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'

permissions:
  contents: read

concurrency:
  group: retired-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, wsl-linux, nucbox-evo-x2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci
      - run: bash -n setup.sh scripts/check-worktree.sh
      - name: Verify retirement and recovery contracts
        run: >-
          npm run test:run --
          tests/server/bootstrap/development-runtime-boundary.test.js
          tests/server/routes/retired-capability.test.js
          tests/server/routes/brainbase.test.js
          tests/server/scripts/retired-setup.test.js
