name: Retired state boundary

on:
  pull_request:
    paths:
      - '.github/workflows/retired-state-boundary.yml'
      - 'lib/**'
      - 'server/bootstrap/**'
      - 'server/controllers/state-controller.js'
      - 'server/routes/**'
      - 'server.js'
      - 'server/middleware/csrf.js'
      - 'mcp/brainbase/src/tools/mesh-tools.ts'
      - 'mcp/brainbase/src/server.ts'
      - 'mcp/brainbase/tests/tools/mesh-tools.test.ts'
      - 'docs/brainbase-capabilities/capabilities/codex.app-server.yml'
      - 'tests/server/routes/portal-routes.test.js'
      - 'tests/server/routes/mesh-routes.test.js'
      - 'tests/mesh/**'
      - 'tests/unit/codex-app-server-capability-retirement.test.js'
      - 'tests/e2e/story-codex-appserver-*-contract.spec.ts'
      - 'setup.sh'
      - 'scripts/setup.sh'
      - 'scripts/check-worktree.sh'
      - 'scripts/session-runtime/**'
      - 'tests/server/bootstrap/development-runtime-boundary.test.js'
      - 'tests/server/routes/retired-capability.test.js'
      - 'tests/server/routes/brainbase.test.js'
      - 'tests/server/scripts/retired-setup.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'

permissions:
  contents: read

concurrency:
  group: retired-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, wsl-linux, nucbox-evo-x2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci
      - run: bash -n setup.sh scripts/check-worktree.sh
      - name: Verify retirement and recovery contracts
        run: >-
          npm run test:run --
          tests/server/bootstrap/development-runtime-boundary.test.js
          tests/server/routes/retired-capability.test.js
          tests/server/routes/brainbase.test.js
          tests/server/scripts/retired-setup.test.js
          tests/server/routes/portal-routes.test.js
          tests/server/routes/mesh-routes.test.js
          tests/mesh/unverified-query-boundary.test.js
          tests/mesh/query/permission-checker.test.js
          tests/unit/codex-app-server-capability-retirement.test.js
      - name: Verify Mesh MCP receipt and authentication contracts
        run: node --import tsx --test mcp/brainbase/tests/tools/mesh-tools.test.ts
      - name: Verify retired Codex capability contracts
        env:
          VIBEPRO_EVIDENCE_ID: brainbase-boundary-cleanup
        run: >-
          npm run test:e2e --
          tests/e2e/story-codex-appserver-thread-session-foundation-contract.spec.ts
          tests/e2e/story-codex-appserver-session-create-contract.spec.ts
          --reporter=line
