name: Graph writer contract

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: graph-writer-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: [self-hosted, Linux, X64, wsl-linux]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure PostgreSQL connection
        run: >-
          echo "PERSONAL_KNOWLEDGE_MIGRATION_DATABASE_URL=postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
          >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ontology:inventory
      - run: >-
          npm run test:run --
          tests/server/scripts/ontology-writer-inventory.test.js
          tests/server/scripts/brainbase-graph-http-client.test.js
          tests/server/scripts/admin-api-path-surface-smoke.test.js
          tests/unit/info-ssot-knowledge-graph-repository.test.js
          tests/unit/personal-knowledge-promotion-service.test.js
          tests/server/middleware/personal-knowledge-promotion-authority.test.js
          tests/server/scripts/personal-knowledge-migration-release-gate.test.js
          tests/server/services/personal-knowledge-promotion-migration.integration.test.js
          tests/server/services/personal-knowledge-promotion-graph-boundary.integration.test.js
          tests/server/scripts/issue-personal-knowledge-promotion-smoke-fixture.test.js
          tests/server/scripts/personal-knowledge-promotion-production-smoke.test.js
          tests/server/routes/personal-knowledge-routes.test.js
          tests/server/services/personal-knowledge-schema.test.js
      - name: Run tenant production provisioning contract suite
        run: npm run test:tenant-production-provisioning
      - name: Prepare Graph maintenance PostgreSQL acceptance role
        run: |
          node --input-type=module <<'EOF'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import { Pool } from 'pg';

          const adminUrl = process.env.PERSONAL_KNOWLEDGE_MIGRATION_DATABASE_URL;
          const role = 'graph_maintenance_ci';
          const password = randomBytes(32).toString('hex');
          const adminPool = new Pool({ connectionString: adminUrl });
          try {
              await adminPool.query(`CREATE ROLE ${role} LOGIN PASSWORD '${password}' NOSUPERUSER NOBYPASSRLS`);
              await adminPool.query(`GRANT CREATE ON DATABASE postgres TO ${role}`);
          } finally {
              await adminPool.end();
          }

          const databaseUrl = new URL(adminUrl);
          databaseUrl.username = role;
          databaseUrl.password = password;
          appendFileSync(process.env.GITHUB_ENV, `GRAPH_MAINTENANCE_DATABASE_URL=${databaseUrl.toString()}\n`);
          EOF
      - name: Run Graph maintenance PostgreSQL acceptance suite
        env:
          RUN_GRAPH_MAINTENANCE_DB_TESTS: '1'
        run: >-
          npm run test:run --
          tests/server/services/graph-maintenance-postgres.integration.test.js
