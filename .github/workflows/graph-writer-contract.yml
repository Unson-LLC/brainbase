name: Graph writer contract

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: graph-writer-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PERSONAL_KNOWLEDGE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ontology:inventory
      - run: >-
          npm run test:run --
          tests/server/scripts/ontology-writer-inventory.test.js
          tests/server/scripts/brainbase-graph-http-client.test.js
          tests/server/scripts/admin-api-path-surface-smoke.test.js
          tests/unit/info-ssot-knowledge-graph-repository.test.js
          tests/unit/personal-knowledge-promotion-service.test.js
          tests/server/middleware/personal-knowledge-promotion-authority.test.js
          tests/server/services/personal-knowledge-promotion-migration.integration.test.js
          tests/server/services/personal-knowledge-promotion-graph-boundary.integration.test.js
          tests/server/scripts/issue-personal-knowledge-promotion-smoke-fixture.test.js
          tests/server/scripts/personal-knowledge-promotion-production-smoke.test.js
          tests/server/routes/personal-knowledge-routes.test.js
          tests/server/services/personal-knowledge-schema.test.js
      - name: Run tenant production provisioning contract suite
        run: npm run test:tenant-production-provisioning
