name: Render Brainbase Archify diagrams

on:
  push:
    branches:
      - develop
      - 'docs/archify-*'
    paths:
      - docs/architecture/diagrams/*.archify.json
      - .github/workflows/archify-diagrams.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archify-diagrams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[archify-generated]')
    runs-on: [self-hosted, Linux, X64, wsl-linux]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned Archify in an isolated run directory
        run: |
          set -euo pipefail
          ARCHIFY_ROOT="${RUNNER_TEMP}/archify-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          rm -rf "$ARCHIFY_ROOT"
          git clone --quiet https://github.com/tt-a1i/archify.git "$ARCHIFY_ROOT"
          git -C "$ARCHIFY_ROOT" checkout --quiet 5de7275fe87a66a19d52a4d9b0b3a4f2a5a90115
          echo "ARCHIFY_ROOT=$ARCHIFY_ROOT" >> "$GITHUB_ENV"
          node "$ARCHIFY_ROOT/archify/bin/archify.mjs" doctor

      - name: Validate and deliver diagrams
        run: |
          set -euo pipefail
          ARCHIFY="$ARCHIFY_ROOT/archify/bin/archify.mjs"
          SRC=docs/architecture/diagrams
          OUT=${SRC}/generated
          RECEIPTS=${SRC}/receipts
          mkdir -p "$OUT" "$RECEIPTS"

          for name in platform-overview current north-star; do
            node "$ARCHIFY" validate architecture "$SRC/$name.archify.json" --quality showcase --json | tee "$RECEIPTS/$name.validate.json"
            node "$ARCHIFY" deliver architecture "$SRC/$name.archify.json" "$OUT/$name.html" --quality showcase --json | tee "$RECEIPTS/$name.deliver.json"
          done

          node "$ARCHIFY" validate dataflow "$SRC/data-flow.archify.json" --quality showcase --json | tee "$RECEIPTS/data-flow.validate.json"
          node "$ARCHIFY" deliver dataflow "$SRC/data-flow.archify.json" "$OUT/data-flow.html" --quality showcase --json | tee "$RECEIPTS/data-flow.deliver.json"

      - name: Prepare Chrome for bounded visual checks
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            CHROME="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            CHROME="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            CHROME="$(command -v chromium-browser)"
          else
            CHROME_ROOT="${RUNNER_TEMP}/chrome-${GITHUB_RUN_ID}-${GITHUB_JOB}"
            CHROME_DEB="${RUNNER_TEMP}/google-chrome-${GITHUB_RUN_ID}-${GITHUB_JOB}.deb"
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O "$CHROME_DEB"
            rm -rf "$CHROME_ROOT"
            mkdir -p "$CHROME_ROOT"
            dpkg-deb -x "$CHROME_DEB" "$CHROME_ROOT"
            CHROME="$CHROME_ROOT/opt/google/chrome/google-chrome"
          fi
          test -x "$CHROME"
          echo "ARCHIFY_CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Run real browser visual checks
        run: |
          set -euo pipefail
          ARCHIFY="$ARCHIFY_ROOT/archify/bin/archify.mjs"
          SRC=docs/architecture/diagrams
          RECEIPTS=${SRC}/receipts
          VISUAL_ROOT="${RUNNER_TEMP}/archify-visual-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          rm -rf "$VISUAL_ROOT"
          mkdir -p "$VISUAL_ROOT"

          for name in platform-overview current north-star data-flow; do
            cp "$SRC/generated/$name.html" "$VISUAL_ROOT/$name.html"
            node "$ARCHIFY" visual-check "$VISUAL_ROOT/$name.html" --json | tee "$RECEIPTS/$name.visual-check.json"
          done

      - name: Extract static SVG
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'docs/architecture/diagrams/generated';
          for (const name of ['platform-overview', 'current', 'north-star', 'data-flow']) {
            const html = fs.readFileSync(path.join(dir, `${name}.html`), 'utf8');
            const match = html.match(/<svg\b[\s\S]*?<\/svg>/i);
            if (!match) throw new Error(`No SVG found in ${name}.html`);
            const styles = [...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)]
              .map((item) => item[1])
              .join('\n');
            const svg = match[0].replace(/<svg\b([^>]*)>/i, (_all, attrs) =>
              `<svg${attrs}><style><![CDATA[${styles}]]></style>`
            );
            fs.writeFileSync(path.join(dir, `${name}.svg`), svg);
          }
          NODE

          for name in platform-overview current north-star data-flow; do
            test -s "docs/architecture/diagrams/generated/$name.svg"
          done

      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/diagrams/generated docs/architecture/diagrams/receipts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "docs: render Brainbase Archify diagrams [archify-generated]"
          git push origin HEAD:${{ github.ref_name }}
