name: Weekly Story Progress Report

on:
  schedule:
    # 毎週月曜日 9:00 JST (0:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行も可能

jobs:
  send-progress-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Story Progress to Slack
        env:
          NOCODB_BASE_URL: ${{ secrets.NOCODB_BASE_URL }}
          NOCODB_ADMIN_EMAIL: ${{ secrets.NOCODB_ADMIN_EMAIL }}
          NOCODB_ADMIN_PASSWORD: ${{ secrets.NOCODB_ADMIN_PASSWORD }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          node scripts/send-story-progress-to-slack.js --channel=#brainbase

      - name: Notify on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          curl -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "#brainbase",
              "text": "⚠️ 週次ストーリー進捗率レポート送信に失敗しました"
            }'
