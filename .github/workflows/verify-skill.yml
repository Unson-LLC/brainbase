name: Verification skill status

# Posts the verify-skill commit status that the merge wrapper requires.
# The decision logic is .github/scripts/verify_skill_status.py.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  # 判定に効かない新しいコメントの実行は、PRごとのグループに入れない。入れると、待っている判定し直しの実行を
  # 取り消したうえで自分はスキップされ、古い判定が残る。job の if で動かす条件と、ちょうど裏返しにする。
  group: ${{ github.event_name == 'issue_comment' && github.event.action == 'created' && !contains(github.event.comment.body, 'RUNNER_VERIFY') && format('verify-skill-noop-{0}', github.run_id) || format('verify-skill-{0}', github.event.pull_request.number || github.event.issue.number) }}
  cancel-in-progress: false

jobs:
  post-status:
    # Fork heads are not merged by the wrapper, and their token cannot post statuses.
    # Comments from anyone on this public repository start this job, so it runs on a
    # GitHub-hosted runner and executes only the default-branch script for comments.
    # 作成されたコメントは、RUNNER_VERIFY を含むときだけ判定し直す。含まない新しいコメントは判定を変えない。
    # 編集と削除は必ず判定し直す。証拠のコメントは RUNNER_VERIFY を含まないことがあり、本文と有無が判定に効く。
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open' && (github.event.action != 'created' || contains(github.event.comment.body, 'RUNNER_VERIFY'))) }}
    name: Post verify-skill status
    runs-on: [self-hosted, Linux, X64, unson-ci-light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test the decision logic
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_skill_status.py'
      - name: Post verification decision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          # The merge policy requires verify-skill for every target branch.
          python3 .github/scripts/verify_skill_status.py "$GITHUB_REPOSITORY" "$PR_NUMBER"
