name: Judgment value proof consumer

on:
  pull_request:
    paths:
      - 'scripts/check-codex-judgment-hook-readiness.mjs'
      - 'tests/unit/codex-judgment-hook-readiness.test.js'
      - 'scripts/codex-hooks/**'
      - 'server/services/routine-runtime/judgment-value-proof-adapter.js'
      - 'mcp/brainbase/**'
      - 'tests/**/judgment-*.test.js'
      - 'tests/integration/j0-organization-pinned-artifact-consumer.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/judgment-value-proof-consumer.yml'
  push:
    branches: [develop]
    paths:
      - 'scripts/check-codex-judgment-hook-readiness.mjs'
      - 'tests/unit/codex-judgment-hook-readiness.test.js'
      - 'scripts/codex-hooks/**'
      - 'server/services/routine-runtime/judgment-value-proof-adapter.js'
      - 'mcp/brainbase/**'
      - 'tests/**/judgment-*.test.js'
      - 'tests/integration/j0-organization-pinned-artifact-consumer.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/judgment-value-proof-consumer.yml'

permissions:
  contents: read

jobs:
  judgment-resolution:
    runs-on: [self-hosted, Linux, X64, wsl-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mcp/brainbase
      - run: npm run test:judgment-resolution
      - run: npm run test:judgment-start-recovery
