name: Publish npm package

on:
  pull_request_target:
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to publish and reconcile
        required: true
        default: develop

concurrency:
  group: npm-publish-unson-brainbase-mcp
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_required: ${{ steps.target.outputs.release_required }}
      package_name: ${{ steps.target.outputs.package_name }}
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve release target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            node scripts/npm-release.mjs plan --before "$BASE_SHA" --after "$MERGE_SHA"
          else
            RELEASE_SHA=$(git rev-parse "$RELEASE_REF")
            git merge-base --is-ancestor "$RELEASE_SHA" origin/develop || {
              echo "release_ref must resolve to a commit reachable from origin/develop" >&2
              exit 1
            }
            VERSION=$(git show "$RELEASE_SHA:package.json" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).version));")
            PACKAGE_NAME=$(git show "$RELEASE_SHA:package.json" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).name));")
            test "$PACKAGE_NAME" = "@unson/brainbase-mcp"
            {
              echo "release_required=true"
              echo "package_name=$PACKAGE_NAME"
              echo "version=$VERSION"
              echo "sha=$RELEASE_SHA"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Check out immutable release commit
        if: ${{ steps.target.outputs.release_required == 'true' }}
        env:
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"
      - name: Install release dependencies
        if: ${{ steps.target.outputs.release_required == 'true' }}
        run: npm ci --ignore-scripts
      - name: Validate release without publication credential
        if: ${{ steps.target.outputs.release_required == 'true' }}
        run: >-
          node scripts/npm-release.mjs validate
          --version "${{ steps.target.outputs.version }}"
          --sha "${{ steps.target.outputs.sha }}"
          --trusted-ref origin/develop
          --proof-file "$RUNNER_TEMP/npm-release-validation.json"
      - name: Transfer validated release artifact
        if: ${{ steps.target.outputs.release_required == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ steps.target.outputs.sha }}
          path: |
            ${{ runner.temp }}/npm-release-validation.json
            ${{ runner.temp }}/unson-brainbase-mcp-${{ steps.target.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Record skipped release
        if: ${{ steps.target.outputs.release_required != 'true' }}
        run: echo "npm publish skipped because package version did not increase" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize failed or cancelled release validation
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          PROOF_FILE: ${{ runner.temp }}/npm-release-validation.json
          ARTIFACT_FILE: ${{ runner.temp }}/unson-brainbase-mcp-${{ steps.target.outputs.version }}.tgz
        run: |
          release_version="${RELEASE_VERSION:-unknown}"
          release_sha="${RELEASE_SHA:-unknown}"
          proof_file="${PROOF_FILE:-unknown}"
          artifact_file="${ARTIFACT_FILE:-unknown}"
          proof_state='unknown'
          artifact_state='unknown'
          if [ "$proof_file" != 'unknown' ] && [ -f "$proof_file" ]; then
            proof_state='present'
            if command -v jq >/dev/null 2>&1; then
              proof_artifact=$(jq -r '.tarballPath // empty' "$proof_file" 2>/dev/null || true)
              if [ -n "$proof_artifact" ]; then artifact_file="$proof_artifact"; fi
            fi
          fi
          if [ "$release_version" = 'unknown' ]; then
            artifact_file='unknown (release version unavailable)'
          elif [ -f "$artifact_file" ]; then
            artifact_state='present'
          fi
          {
            echo '## npm release validation failure/cancellation summary'
            echo
            echo '- Protection: immutable release SHA, package artifact, validation proof, and trusted ref are checked before publication.'
            echo "- Target: version \`$release_version\`, SHA \`$release_sha\`."
            echo "- Proof: \`$proof_file\` ($proof_state); artifact: \`$artifact_file\` ($artifact_state)."
            echo "- Reproduce: \`npm ci --ignore-scripts && node scripts/npm-release.mjs validate --version $release_version --sha $release_sha --trusted-ref origin/develop --proof-file $proof_file\`."
            echo '- Expected: validation produces the proof and tarball consumed by the publish job; publication is skipped when no version increase is required.'
            echo '- Unknown: inspect the failed step; artifact publication, npm readback, and GitHub Release state require separate confirmation.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    if: ${{ needs.validate.outputs.release_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.5.1
      - name: Check out immutable release commit
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"
      - name: Restore validated release artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-release-${{ needs.validate.outputs.sha }}
          path: ${{ runner.temp }}/npm-release
      - name: Publish and verify npm package
        env:
          BRAINBASE_NPM_PUBLISH_SERIALIZED: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: >-
          node scripts/npm-release.mjs publish
          --version "$VERSION"
          --sha "$RELEASE_SHA"
          --trusted-ref origin/develop
          --proof-file "$RUNNER_TEMP/npm-release/npm-release-validation.json"
          --tarball-file "$RUNNER_TEMP/npm-release/unson-brainbase-mcp-${VERSION}.tgz"
          --provenance
      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          git fetch --tags --force
          if TAG_SHA=$(git rev-parse -q --verify "refs/tags/v${VERSION}^{commit}"); then
            test "$TAG_SHA" = "$RELEASE_SHA" || {
              echo "v${VERSION} points to $TAG_SHA, expected $RELEASE_SHA" >&2
              exit 1
            }
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            test -n "${TAG_SHA:-}"
          else
            gh release create "v${VERSION}" --target "$RELEASE_SHA" --title "Brainbase MCP ${VERSION}" --generate-notes
          fi

      - name: Summarize failed or cancelled publication
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          PROOF_FILE: ${{ runner.temp }}/npm-release/npm-release-validation.json
          ARTIFACT_FILE: ${{ runner.temp }}/npm-release/unson-brainbase-mcp-${{ needs.validate.outputs.version }}.tgz
        run: |
          release_version="${RELEASE_VERSION:-unknown}"
          release_sha="${RELEASE_SHA:-unknown}"
          proof_file="${PROOF_FILE:-unknown}"
          artifact_file="${ARTIFACT_FILE:-unknown}"
          proof_state='unknown'
          artifact_state='unknown'
          if [ "$proof_file" != 'unknown' ] && [ -f "$proof_file" ]; then
            proof_state='present'
            if command -v jq >/dev/null 2>&1; then
              proof_artifact=$(jq -r '.tarballPath // empty' "$proof_file" 2>/dev/null || true)
              if [ -n "$proof_artifact" ]; then artifact_file="$proof_artifact"; fi
            fi
          fi
          if [ "$release_version" = 'unknown' ]; then
            artifact_file='unknown (release version unavailable)'
          elif [ -f "$artifact_file" ]; then
            artifact_state='present'
          fi
          {
            echo '## npm publication failure/cancellation summary'
            echo
            echo '- Protection: only the validated immutable artifact is published with provenance, then npm and GitHub Release state are read back.'
            echo "- Target: version \`$release_version\`, SHA \`$release_sha\`."
            echo "- Proof: \`$proof_file\` ($proof_state); artifact: \`$artifact_file\` ($artifact_state)."
            echo "- Reproduce preflight: \`npm ci --ignore-scripts && node scripts/npm-release.mjs validate --version $release_version --sha $release_sha --trusted-ref origin/develop --proof-file $proof_file\`."
            echo '- Expected: the publish job consumes the transferred proof and tarball and verifies the published release identity.'
            echo '- Unknown: npm registry and GitHub Release state are unconfirmed until their readback commands succeed; do not retry publication blindly.'
          } >> "$GITHUB_STEP_SUMMARY"
