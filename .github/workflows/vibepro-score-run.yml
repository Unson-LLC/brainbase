name: VibePro Score Run

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'session/**']
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  vibepro-score:
    name: Run VibePro Control-Plane Score
    runs-on: ubuntu-latest

    env:
      VIBEPRO_RUN_DIR: ${{ runner.temp }}/vibepro-score-run

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scorer unit tests
        run: npm run test:run -- tests/unit/vibepro-score-run.test.js

      - name: Run VibePro self-evaluation
        run: npm run vibepro:ci

      - name: Enforce VibePro score gates
        run: node scripts/vibepro-score-run.mjs gate "$VIBEPRO_RUN_DIR"

      - name: Upload VibePro run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibepro-score-run
          path: ${{ env.VIBEPRO_RUN_DIR }}
          retention-days: 14
