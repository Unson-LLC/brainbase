name: VibePro Minimal Core Contract

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/vibepro-score-run.yml'
      - '.github/workflows/vibepro-graphify-impact.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/skills/vibepro-*/**'
      - 'tests/unit/vibepro-minimal-core-contract.test.js'
      - 'tests/unit/vibepro-score-actions-workflow-contract.test.js'
      - 'tests/unit/vibepro-graph-actions-workflow-contract.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
  push:
    branches: [main, develop, 'session/**']
    paths:
      - '.github/workflows/vibepro-score-run.yml'
      - '.github/workflows/vibepro-graphify-impact.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/skills/vibepro-*/**'
      - 'tests/unit/vibepro-minimal-core-contract.test.js'
      - 'tests/unit/vibepro-score-actions-workflow-contract.test.js'
      - 'tests/unit/vibepro-graph-actions-workflow-contract.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  minimal-core-contract:
    name: Verify VibePro minimal-core instructions
    runs-on: [self-hosted, Linux, X64, wsl-linux]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify minimal-core instructions
        run: npm run test:run -- tests/unit/vibepro-minimal-core-contract.test.js tests/unit/vibepro-score-actions-workflow-contract.test.js tests/unit/vibepro-graph-actions-workflow-contract.test.js
