name: Build and test pull request

on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - docs/**
      - .vibepro/**
      - .github/workflows/docs-cloudflare-pages.yml
      - .github/workflows/public-message-promotion.yml

concurrency:
  group: brainbase-pr-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: 22
            suite: complete
          - node_version: 20
            suite: representative
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and typecheck package
        run: npm run build

      - name: Run complete package suite on Node 22
        if: ${{ matrix.suite == 'complete' }}
        run: npm test

      - name: Run representative integration suite on Node 20
        if: ${{ matrix.suite == 'representative' }}
        run: npm run test:integration

      - name: Summarize failed or cancelled package validation
        if: ${{ always() && (failure() || cancelled()) }}
        run: |
          {
            echo '## Package CI failure/cancellation summary'
            echo
            echo '- Protection: Node 22 complete package validation and Node 20 representative integration validation.'
            echo '- Reproduce: `npm ci --ignore-scripts && npm run build && npm test` (Node 22), or `npm ci --ignore-scripts && npm run build && npm run test:integration` (Node 20).'
            echo '- Expected: package changes pass the build and required suite; docs-only changes use the docs workflow.'
            echo '- Unknown: inspect the failed step and runner log; this workflow has no release or deployment side effect.'
          } >> "$GITHUB_STEP_SUMMARY"
