name: Build and test pull request

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - docs/**
      - .vibepro/**
      - .github/workflows/docs-cloudflare-pages.yml
      - .github/workflows/public-message-promotion.yml

concurrency:
  group: brainbase-pr-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_BACKUP == 'on' && '"ubuntu-latest"' || '["self-hosted","Linux","X64","unson-ci-linux"]') }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432/tcp
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: 22
            suite: complete
          - node_version: 20
            suite: representative
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Build and typecheck package
        if: ${{ matrix.suite != 'complete' }}
        run: npm run build

      # EVO-X2 shares one machine between several runner slots. Vitest's
      # default worker count follows the machine's cores, so concurrent jobs
      # oversubscribe it. Now that formal-release-validate-linux no longer runs
      # a duplicate full suite on PRs, four thread workers with /dev/shm TMPDIR,
      # LPT scheduling, stateless module reuse, and 30s limits avoid CPU
      # thrashing while keeping the suite fast and stable. Running
      # git-commit-consumer-smoke (which clones HEAD and builds in isolation,
      # never touching dist/) in parallel with build + the remaining 271 files
      # overlaps its ~65-80s runtime with build + tests.
      - name: Build and run complete package suite on Node 22
        if: ${{ matrix.suite == 'complete' }}
        env:
          BRAINBASE_TEST_SKIP_BUILD: '1'
          CANONICAL_TASK_PG_TEST_ADMIN_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
          CANONICAL_TASK_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
          CANONICAL_TASK_PG_TEST_REQUIRED: '1'
        run: |
          set -o pipefail
          git_smoke_log="$RUNNER_TEMP/git-commit-consumer-smoke.log"
          npx vitest run tests/git-commit-consumer-smoke.integration.test.ts --maxWorkers=1 --testTimeout=30000 --hookTimeout=30000 >"$git_smoke_log" 2>&1 &
          git_smoke_pid=$!
          cleanup_git_smoke() {
            if kill -0 "$git_smoke_pid" 2>/dev/null; then
              kill "$git_smoke_pid" 2>/dev/null || true
              wait "$git_smoke_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_git_smoke EXIT

          main_status=0
          npm run build || main_status=$?
          if [ "$main_status" -eq 0 ]; then
            npm test -- --exclude tests/git-commit-consumer-smoke.integration.test.ts --maxWorkers=4 --testTimeout=30000 --hookTimeout=30000 || main_status=$?
          fi

          git_smoke_status=0
          wait "$git_smoke_pid" || git_smoke_status=$?
          trap - EXIT
          echo "=== git-commit-consumer-smoke output ==="
          cat "$git_smoke_log"
          if [ "$main_status" -ne 0 ]; then exit "$main_status"; fi
          exit "$git_smoke_status"

      - name: Run representative integration suite on Node 20
        if: ${{ matrix.suite == 'representative' }}
        env:
          BRAINBASE_TEST_SKIP_BUILD: '1'
        run: npm run test:integration -- --maxWorkers=4 --testTimeout=30000 --hookTimeout=30000

      - name: Run routine runtime regression tests on Node 20
        if: ${{ matrix.suite == 'representative' }}
        run: npx vitest run tests/stage3c-runtime.test.ts --maxWorkers=1

      - name: Summarize failed or cancelled package validation
        if: ${{ always() && (failure() || cancelled()) }}
        run: |
          {
            echo '## Package CI failure/cancellation summary'
            echo
            echo '- Protection: Node 22 complete package validation and Node 20 representative integration validation.'
            echo '- Reproduce: `npm ci --ignore-scripts && npm run build && npm test -- --maxWorkers=4 --testTimeout=30000 --hookTimeout=30000` (Node 22), or `npm ci --ignore-scripts && npm run build && npm run test:integration -- --maxWorkers=4 --testTimeout=30000 --hookTimeout=30000 && npx vitest run tests/stage3c-runtime.test.ts --maxWorkers=1` (Node 20).'
            echo '- Expected: package changes pass the build and required suite; docs-only changes use the docs workflow.'
            echo '- Unknown: inspect the failed step and runner log; this workflow has no release or deployment side effect.'
          } >> "$GITHUB_STEP_SUMMARY"

  formal-release-validate-linux:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_BACKUP == 'on' && '"ubuntu-latest"' || '["self-hosted","Linux","X64","unson-ci-linux"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out immutable pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Resolve immutable validation target
        id: target
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -n "$HEAD_REF"
          TRUSTED_REF="origin/$HEAD_REF"
          git rev-parse --verify "$TRUSTED_REF^{commit}" >/dev/null
          git merge-base --is-ancestor "$HEAD_SHA" "$TRUSTED_REF"
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          test -n "$VERSION"
          {
            echo "sha=$HEAD_SHA"
            echo "trusted_ref=$TRUSTED_REF"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Install release dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      # build-and-test (22, complete) already executes the complete Vitest suite
      # (including PostgreSQL integration tests) on the same pull request. Avoid
      # running the full suite twice concurrently on the shared EVO-X2 runner while
      # still validating immutable HEAD, clean checkout, build, production audit,
      # tarball creation/hashing, and isolated consumer smoke. npm-publish.yml does
      # not pass --skip-tests and always runs the complete suite before publishing.
      - name: Run formal release validation without publication credentials
        env:
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          TRUSTED_REF: ${{ steps.target.outputs.trusted_ref }}
        run: |
          shm_tmp=""
          if [ -d /dev/shm ] && [ -w /dev/shm ]; then
            shm_tmp=$(mktemp -d /dev/shm/brainbase-release-validate-XXXXXX)
            trap 'rm -rf "$shm_tmp"' EXIT
            export TMPDIR="$shm_tmp"
          fi
          npm run release:validate -- \
            --version "$RELEASE_VERSION" \
            --sha "$RELEASE_SHA" \
            --trusted-ref "$TRUSTED_REF" \
            --proof-file "$RUNNER_TEMP/npm-release-validation.json" \
            --skip-tests

      - name: Upload formal release proof and artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-pr-${{ github.event.pull_request.number }}-${{ steps.target.outputs.sha }}
          path: |
            ${{ runner.temp }}/npm-release-validation.json
            ${{ runner.temp }}/unson-brainbase-mcp-${{ steps.target.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Summarize failed or cancelled formal validation
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          TRUSTED_REF: ${{ steps.target.outputs.trusted_ref }}
          PROOF_FILE: ${{ runner.temp }}/npm-release-validation.json
          ARTIFACT_FILE: ${{ runner.temp }}/unson-brainbase-mcp-${{ steps.target.outputs.version }}.tgz
        run: |
          release_version="${RELEASE_VERSION:-unknown}"
          release_sha="${RELEASE_SHA:-unknown}"
          trusted_ref="${TRUSTED_REF:-unknown}"
          proof_file="${PROOF_FILE:-unknown}"
          artifact_file="${ARTIFACT_FILE:-unknown}"
          proof_state='missing'
          artifact_state='missing'
          if [ "$proof_file" != 'unknown' ] && [ -f "$proof_file" ]; then proof_state='present'; fi
          if [ "$artifact_file" != 'unknown' ] && [ -f "$artifact_file" ]; then artifact_state='present'; fi
          {
            echo '## Linux formal release validation failure/cancellation summary'
            echo
            echo '- Protection: immutable pull request head, real PR branch trusted ref, full release validation, and read-only permissions.'
            echo "- Target: version \`$release_version\`, SHA \`$release_sha\`, trusted ref \`$trusted_ref\`."
            echo "- Proof: \`$proof_file\` ($proof_state); artifact: \`$artifact_file\` ($artifact_state)."
            echo "- Reproduce: \`npm ci --ignore-scripts && npm run release:validate -- --version $release_version --sha $release_sha --trusted-ref $trusted_ref --proof-file $proof_file\`."
            echo '- Expected: validation produces the proof and tarball; this job does not publish or deploy.'
            echo '- Unknown: inspect the failed step before treating the package as formally validated.'
          } >> "$GITHUB_STEP_SUMMARY"
