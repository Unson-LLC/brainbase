name: Repair private VibePro Knowledge Event receiver

on:
  push:
    branches:
      - codex/vibepro-knowledge-event-record-v1

permissions:
  contents: write

concurrency:
  group: private-vibepro-knowledge-event-record-v1-fix
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/vibepro-knowledge-event-record-v1
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix mcp/brainbase ci

      - name: Materialize strict server and test wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count was {count}, expected 1')
              return text.replace(old, new, 1)

          server = Path('mcp/brainbase/src/server.ts')
          text = server.read_text()
          import_anchor = "import { handleTaskToolCall, taskTools } from './tools/task-tools.js';\n"
          import_replacement = import_anchor + "import { handleKnowledgeEventToolCall, knowledgeEventTools } from './tools/knowledge-event-tools.js';\n"
          if "from './tools/knowledge-event-tools.js'" not in text:
              text = replace_once(text, import_anchor, import_replacement, 'knowledge-event import')

          tools_anchor = "  ...taskTools,\n  ...meetingMinutesContextTools,"
          tools_replacement = "  ...taskTools,\n  ...knowledgeEventTools,\n  ...meetingMinutesContextTools,"
          if '  ...knowledgeEventTools,' not in text:
              text = replace_once(text, tools_anchor, tools_replacement, 'published tool list')

          dispatch_anchor = "  if (taskResult) return taskResult;\n\n  const meshResult = await handleMeshToolCall(name, args, {"
          dispatch_replacement = """  if (taskResult) return taskResult;

  const knowledgeEventResult = await handleKnowledgeEventToolCall(name, args, {
    ...(options.apiBase ? { apiBase: options.apiBase } : {}),
    ...(context.accessToken ? { accessToken: context.accessToken } : {})
  });
  if (knowledgeEventResult) return knowledgeEventResult;

  const meshResult = await handleMeshToolCall(name, args, {"""
          if 'const knowledgeEventResult = await handleKnowledgeEventToolCall' not in text:
              text = replace_once(text, dispatch_anchor, dispatch_replacement, 'tool dispatch')
          server.write_text(text)

          annotations = Path('mcp/brainbase/src/tools/tool-annotations.ts')
          text = annotations.read_text()
          annotation_anchor = "  'brainbase_task_update'\n]);"
          annotation_replacement = "  'brainbase_task_update',\n  'brainbase_knowledge_event_record'\n]);"
          if "'brainbase_knowledge_event_record'" not in text:
              text = replace_once(text, annotation_anchor, annotation_replacement, 'write tool annotation')
          annotations.write_text(text)

          test_file = Path('mcp/brainbase/tests/tools/knowledge-event-tools.test.ts')
          text = test_file.read_text()
          signature_old = "function dependencies(options: {\n  idempotent?: boolean;\n  graphEntityId?: string | null;\n  processingStage?: string;\n  semanticState?: string;\n} = {}): KnowledgeEventToolDependencies & { fetcher: ReturnType<typeof vi.fn> } {"
          signature_new = "function dependencies(options: {\n  idempotent?: boolean;\n  graphEntityId?: string | null;\n  processingStage?: string;\n  semanticState?: string;\n} = {}): KnowledgeEventToolDependencies & { fetcher: ReturnType<typeof vi.fn> & typeof fetch } {"
          text = replace_once(text, signature_old, signature_new, 'test dependency signature')

          mock_tail_old = "    return jsonResponse({ error: 'unexpected route' }, 404);\n  });\n  return {"
          mock_tail_new = "    return jsonResponse({ error: 'unexpected route' }, 404);\n  }) as unknown as ReturnType<typeof vi.fn> & typeof fetch;\n  return {"
          text = replace_once(text, mock_tail_old, mock_tail_new, 'fetch mock cast')

          call_old = "    const eventRequest = deps.fetcher.mock.calls[1];"
          call_new = "    const eventRequest = deps.fetcher.mock.calls[1] as unknown as [string | URL | Request, RequestInit];"
          text = replace_once(text, call_old, call_new, 'mock call tuple')
          test_file.write_text(text)

          for workflow in [
              Path('.github/workflows/pr-vibepro-knowledge-event-record-mcp.yml'),
              Path('.github/workflows/pr-vibepro-knowledge-event-record-mcp-fix.yml')
          ]:
              if workflow.exists():
                  subprocess.run(['git', 'rm', '-f', workflow.as_posix()], check=True)
          PY

      - name: Verify focused MCP contracts
        run: |
          npm run build
          npx vitest run tests/tools/knowledge-event-tools.test.ts tests/tools/knowledge-event-server-wiring.test.ts
        working-directory: mcp/brainbase

      - name: Verify full MCP regression
        run: npm test
        working-directory: mcp/brainbase

      - name: Verify backend and architecture regression
        run: |
          npm test
          npm run check:architecture-model
          git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat: record verified VibePro Knowledge Events through Brainbase"
          HUSKY=0 git push origin HEAD:codex/vibepro-knowledge-event-record-v1
