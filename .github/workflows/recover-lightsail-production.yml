name: Recover Lightsail production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brainbase-lightsail-production-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Reboot and verify brainbase-nocodb
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_REGION: ap-northeast-1
      INSTANCE_NAME: brainbase-nocodb
      HEALTH_URL: https://bb.unson.jp/api/health
    steps:
      - name: Record current instance state
        run: |
          set -euo pipefail
          aws lightsail get-instance-state \
            --instance-name "$INSTANCE_NAME" \
            --query 'state.{code:code,name:name}' \
            --output json

      - name: Reboot fixed production instance
        run: |
          set -euo pipefail
          aws lightsail reboot-instance --instance-name "$INSTANCE_NAME"

      - name: Wait for AWS running state
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            state=$(aws lightsail get-instance-state \
              --instance-name "$INSTANCE_NAME" \
              --query 'state.name' \
              --output text)
            printf 'attempt=%s state=%s\n' "$attempt" "$state"
            if [ "$state" = "running" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Lightsail instance did not return to running state" >&2
          exit 1

      - name: Verify public Brainbase health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl \
              --connect-timeout 5 \
              --max-time 10 \
              --silent \
              --show-error \
              --output /tmp/brainbase-health.json \
              --write-out '%{http_code}' \
              "$HEALTH_URL" || true)
            printf 'attempt=%s http=%s\n' "$attempt" "$status"
            if [ "$status" = "200" ]; then
              node -e '
                const fs = require("node:fs");
                const body = JSON.parse(fs.readFileSync("/tmp/brainbase-health.json", "utf8"));
                if (body.status !== "healthy") process.exit(1);
                console.log(JSON.stringify(body));
              '
              exit 0
            fi
            sleep 10
          done
          echo "Brainbase public health did not recover" >&2
          exit 1
