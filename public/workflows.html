<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Brainbase Workflows</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #151b23;
            --line: #2f3742;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #7c5cff;
            --good: #2ea043;
            --warn: #d29922;
            --bad: #f85149;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px;
        }
        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 22px;
        }
        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 0;
        }
        .sub {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        select, button {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            border-radius: 6px;
            min-height: 34px;
            padding: 0 10px;
            font: inherit;
        }
        button { cursor: pointer; }
        .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .metric, .workflow, .empty, .error {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 8px;
        }
        .metric {
            padding: 14px;
        }
        .metric strong {
            display: block;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .metric span {
            color: var(--muted);
            font-size: 13px;
        }
        .grid {
            display: grid;
            gap: 10px;
        }
        .workflow {
            display: grid;
            grid-template-columns: minmax(220px, 1.3fr) minmax(170px, 0.9fr) minmax(160px, 0.8fr) minmax(220px, 1fr);
            gap: 12px;
            padding: 14px;
            align-items: center;
        }
        .title {
            font-weight: 700;
            margin-bottom: 5px;
        }
        .meta, .context, .latest {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .context strong {
            color: var(--text);
            font-size: 12px;
            display: block;
            margin-bottom: 2px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--line);
        }
        .success { color: var(--good); }
        .waiting_human, .needs_action { color: var(--warn); }
        .failed { color: var(--bad); }
        .empty, .error {
            padding: 18px;
            color: var(--muted);
        }
        .error { color: var(--bad); }
        @media (max-width: 820px) {
            main { padding: 18px; }
            header { display: block; }
            .toolbar { margin-top: 14px; }
            .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .workflow { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <h1>Workflow Mission Control</h1>
                <div class="sub">Project context, owner, latest run, action required, and human waiting state.</div>
            </div>
            <div class="toolbar">
                <select id="project-filter" aria-label="Project filter">
                    <option value="">All projects</option>
                </select>
                <button id="refresh-btn" type="button">Refresh</button>
            </div>
        </header>
        <section class="summary" aria-label="Workflow summary">
            <div class="metric"><strong id="metric-total">0</strong><span>Total workflows</span></div>
            <div class="metric"><strong id="metric-action">0</strong><span>Action required</span></div>
            <div class="metric"><strong id="metric-human">0</strong><span>Human waiting</span></div>
            <div class="metric"><strong id="metric-failed">0</strong><span>Failed latest runs</span></div>
        </section>
        <section id="workflow-list" class="grid" aria-live="polite">
            <div class="empty">Loading workflows...</div>
        </section>
    </main>
    <script type="module">
        const listEl = document.getElementById('workflow-list');
        const filterEl = document.getElementById('project-filter');
        const refreshBtn = document.getElementById('refresh-btn');
        const metrics = {
            total: document.getElementById('metric-total'),
            action: document.getElementById('metric-action'),
            human: document.getElementById('metric-human'),
            failed: document.getElementById('metric-failed')
        };

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function latestLabel(run) {
            if (!run) return 'No runs yet';
            const when = run.finished_at || run.started_at || run.created_at || '';
            return `${run.status || 'unknown'} / ${when}`;
        }

        function contextLabel(sources) {
            return Array.isArray(sources) && sources.length > 0
                ? sources.map((source) => `${source.source_type}:${source.source_ref || '-'}`).join(', ')
                : '-';
        }

        function snapshotLabel(snapshots) {
            return Array.isArray(snapshots) && snapshots.length > 0
                ? snapshots.map((snapshot) => `${snapshot.source_type}:${snapshot.source_ref || '-'} (${snapshot.status || 'resolved'})`).join(', ')
                : 'No run context yet';
        }

        function updateProjectOptions(workflows) {
            const current = filterEl.value;
            const projects = [...new Set(workflows.map((workflow) => workflow.project_id).filter(Boolean))].sort();
            filterEl.innerHTML = '<option value="">All projects</option>' + projects
                .map((project) => `<option value="${escapeHtml(project)}">${escapeHtml(project)}</option>`)
                .join('');
            filterEl.value = projects.includes(current) ? current : '';
        }

        function render(workflows) {
            const selectedProject = filterEl.value;
            const visible = selectedProject
                ? workflows.filter((workflow) => workflow.project_id === selectedProject)
                : workflows;
            const actionRequired = visible.filter((workflow) => workflow.latest_run && workflow.latest_run.action_required !== 'none').length;
            const humanWaiting = visible.filter((workflow) => workflow.latest_run?.human_waiting).length;
            const failed = visible.filter((workflow) => workflow.latest_run?.status === 'failed').length;
            metrics.total.textContent = String(visible.length);
            metrics.action.textContent = String(actionRequired);
            metrics.human.textContent = String(humanWaiting);
            metrics.failed.textContent = String(failed);

            if (visible.length === 0) {
                listEl.innerHTML = '<div class="empty">No workflows for this project.</div>';
                return;
            }
            listEl.innerHTML = visible.map((workflow) => {
                const run = workflow.latest_run || null;
                const status = run?.status || 'not_run';
                const context = contextLabel(workflow.context_sources);
                const snapshots = snapshotLabel(workflow.latest_context_snapshots);
                return `
                    <article class="workflow">
                        <div>
                            <div class="title">${escapeHtml(workflow.name || workflow.id)}</div>
                            <div class="meta">Project: ${escapeHtml(workflow.project_id)} / Owner: ${escapeHtml(workflow.owner_id)}</div>
                        </div>
                        <div>
                            <span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span>
                            <div class="latest">${escapeHtml(latestLabel(run))}</div>
                        </div>
                        <div class="meta">
                            Action: ${escapeHtml(run?.action_required || 'none')}<br>
                            Human waiting: ${run?.human_waiting ? 'yes' : 'no'}
                        </div>
                        <div class="context">
                            <strong>Planned context</strong>
                            ${escapeHtml(context)}<br>
                            <strong>Resolved context</strong>
                            ${escapeHtml(snapshots)}
                        </div>
                    </article>
                `;
            }).join('');
        }

        let cachedWorkflows = [];
        async function load() {
            listEl.innerHTML = '<div class="empty">Loading workflows...</div>';
            try {
                const response = await fetch('/api/workflows', { credentials: 'include' });
                if (response.status === 401) {
                    listEl.innerHTML = '<div class="error">ログインが必要です。</div>';
                    return;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                cachedWorkflows = Array.isArray(data.workflows) ? data.workflows : [];
                updateProjectOptions(cachedWorkflows);
                render(cachedWorkflows);
            } catch (error) {
                listEl.innerHTML = `<div class="error">Workflow を読み込めません: ${escapeHtml(error.message)}</div>`;
            }
        }

        filterEl.addEventListener('change', () => render(cachedWorkflows));
        refreshBtn.addEventListener('click', load);
        load();
    </script>
</body>
</html>
