<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainbase Workflows</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            --bg: #eef2f6;
            --panel: #ffffff;
            --ink: #111418;
            --muted: #667085;
            --line: #20242a;
            --soft-line: #d8dee7;
            --mint: #b7e4dc;
            --accent: #7c4dff;
            --bad: #d92d20;
            --warn: #b7791f;
            --good: #027a48;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }
        .shell {
            display: grid;
            grid-template-columns: 326px 1fr;
            gap: 18px;
            min-height: 100vh;
            padding: 22px;
        }
        .assistant {
            border: 2px solid var(--line);
            border-radius: 26px;
            background: var(--panel);
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .assistant h2 { margin: 0; font-size: 17px; }
        .assistant .hint {
            font-size: 14px;
            line-height: 1.75;
        }
        .assistant textarea {
            width: 100%;
            min-height: 110px;
            border: 0;
            border-top: 1px dashed var(--line);
            padding-top: 18px;
            resize: vertical;
            color: var(--muted);
            font: inherit;
        }
        .surface {
            border: 2px solid var(--line);
            border-radius: 26px;
            overflow: hidden;
            background: #f8fafc;
            min-width: 0;
        }
        .topbar {
            min-height: 48px;
            background: var(--mint);
            border-bottom: 2px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
        }
        .crumbs, .toolbar, .meta-row, .chips, .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .crumbs button, .toolbar button, .toolbar select {
            min-height: 34px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--ink);
            font: inherit;
        }
        .toolbar button, .toolbar select, .btn {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 18px;
            padding: 0 12px;
            cursor: pointer;
        }
        .btn {
            display: inline-flex;
            min-height: 34px;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn.primary {
            background: #121619;
            color: #fff;
        }
        .btn.soft {
            background: #f8fafc;
        }
        .content {
            padding: 34px;
        }
        h1 { margin: 0; font-size: 30px; line-height: 1.2; }
        h2 { margin: 0; font-size: 23px; }
        h3 { margin: 0; font-size: 16px; }
        .sub { color: var(--muted); font-size: 13px; line-height: 1.45; }
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 28px;
        }
        .view-heading {
            display: grid;
            gap: 8px;
        }
        .inline-back {
            width: fit-content;
            min-height: 28px;
            padding: 0 10px;
            font-size: 13px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            border: 1px solid var(--soft-line);
            border-radius: 999px;
            padding: 0 8px;
            font-size: 12px;
            color: var(--muted);
            background: #fff;
        }
        .badge.warn { color: var(--warn); border-color: #f6d58f; }
        .badge.good { color: var(--good); border-color: #a6f4c5; }
        .badge.bad { color: var(--bad); border-color: #fecdca; }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .card-button, .panel, .row-table {
            border: 2px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }
        .card-button {
            min-height: 96px;
            padding: 18px;
            text-align: left;
            display: grid;
            grid-template-columns: 28px 1fr 20px;
            gap: 12px;
            align-items: center;
            cursor: pointer;
        }
        .workflow-card {
            width: 100%;
            min-height: 96px;
            padding: 18px;
            text-align: left;
            display: grid;
            grid-template-columns: 28px 1fr 20px;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            border: 2px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }
        .stack { display: grid; gap: 14px; }
        .layout-two {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(300px, 0.85fr);
            gap: 18px;
        }
        .panel {
            padding: 18px;
        }
        .panel-title {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px;
        }
        .section-title {
            justify-content: space-between;
            margin: 28px 0 14px;
        }
        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .field-grid .full { grid-column: 1 / -1; }
        label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
        input, select, textarea {
            min-height: 36px;
            border: 1px solid var(--soft-line);
            border-radius: 6px;
            padding: 0 10px;
            background: #fff;
            color: var(--ink);
            font: inherit;
        }
        .row-table { overflow: hidden; }
        .row, .row-button {
            display: grid;
            grid-template-columns: 1fr 190px 150px;
            gap: 12px;
            width: 100%;
            padding: 14px 18px;
            border: 0;
            border-top: 1px solid var(--soft-line);
            background: #fff;
            text-align: left;
            font: inherit;
        }
        .row-head { color: var(--muted); background: #f8fafc; border-top: 0; }
        .canvas {
            min-height: 230px;
            background-image: linear-gradient(#e8edf3 1px, transparent 1px), linear-gradient(90deg, #e8edf3 1px, transparent 1px);
            background-size: 24px 24px;
            border: 1px solid var(--soft-line);
            overflow: auto;
            padding: 42px;
        }
        .canvas-row {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 820px;
        }
        .node {
            min-width: 180px;
            border: 2px solid #000;
            border-radius: 8px;
            background: #fff;
            padding: 14px;
            box-shadow: 3px 4px 0 #000;
        }
        .node-title { font-weight: 800; margin-bottom: 6px; }
        .node-copy { color: var(--muted); font-size: 12px; }
        .connector { height: 2px; min-width: 40px; background: #000; }
        .trace-list { display: grid; gap: 10px; }
        .trace-item {
            border: 1px solid var(--soft-line);
            border-radius: 6px;
            padding: 12px;
            background: #fff;
        }
        .draft-preview {
            display: grid;
            gap: 12px;
            margin-top: 14px;
        }
        .draft-preview .canvas {
            min-height: 180px;
            padding: 28px;
        }
        .draft-status {
            min-height: 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .error, .empty {
            border: 2px solid var(--line);
            border-radius: 8px;
            background: #fff;
            padding: 18px;
        }
        .error { color: var(--bad); }
        .view { display: none; }
        .view.active { display: block; }
        @media (max-width: 980px) {
            .shell { grid-template-columns: 1fr; padding: 12px; }
            .assistant { display: none; }
            .project-grid, .layout-two { grid-template-columns: 1fr; }
            .content { padding: 22px; }
            .row, .row-button { grid-template-columns: 1fr; }
        }
        body.embedded {
            min-height: 100vh;
        }
        body.embedded .shell {
            display: block;
            min-height: 100vh;
            padding: 0;
        }
        body.embedded .assistant,
        body.embedded .topbar,
        body.embedded .terminal-return-link {
            display: none;
        }
        body.embedded .surface {
            min-height: 100vh;
            border: 0;
            border-radius: 0;
        }
        body.embedded .content {
            padding: 20px 24px 24px;
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="assistant" aria-label="AI assistant">
            <div class="toolbar">
                <h2>新しいワークフローを作りたい</h2>
                <a href="/" aria-label="Brainbase home">⌂</a>
            </div>
            <div class="hint">
                <strong>目的・入力・出力</strong>を1文ずつ決めると、Project 配下の workflow として整理できます。
            </div>
            <div class="hint">
                Project を選び、その中で workflow、document/context、run trace を確認します。Canvas は設計の見取り図で、実行証跡は Run detail が正本です。
            </div>
            <textarea id="assistant-draft" placeholder="例: 毎朝、予定と未完了タスクをまとめるワークフローを作りたい" aria-label="AIアシスタントに質問してください"></textarea>
        </aside>

        <main class="surface">
            <nav class="topbar" aria-label="Workflow navigation">
                <div class="crumbs" id="breadcrumbs"></div>
                <div class="toolbar">
                    <a class="btn soft terminal-return-link" href="/" aria-label="Brainbase terminalへ戻る">Terminalへ戻る</a>
                    <select id="project-filter" aria-label="Project filter"><option value="">All projects</option></select>
                    <button id="refresh-btn" type="button">Refresh</button>
                </div>
            </nav>
            <div class="content">
                <section id="workspace-view" class="view active"></section>
                <section id="project-view" class="view"></section>
                <section id="workflow-view" class="view"></section>
                <section id="run-view" class="view"></section>
            </div>
        </main>
    </div>

    <script type="module">
        const embeddedMode = new URLSearchParams(window.location.search).get('embedded') === '1';
        if (embeddedMode) document.body.classList.add('embedded');

        const state = {
            projects: [],
            workflows: [],
            selectedProjectId: '',
            selectedWorkflowId: '',
            selectedRunId: '',
            workflowDetail: null,
            runDetail: null,
            workflowDraft: null,
            workflowDraftTest: null
        };
        const views = {
            workspace: document.getElementById('workspace-view'),
            project: document.getElementById('project-view'),
            workflow: document.getElementById('workflow-view'),
            run: document.getElementById('run-view')
        };
        const breadcrumbs = document.getElementById('breadcrumbs');
        const filterEl = document.getElementById('project-filter');
        const refreshBtn = document.getElementById('refresh-btn');
        const AUTH_TOKEN_KEY = 'brainbase.auth.token';

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }
        function errorMessage(data, fallback) {
            if (typeof data?.error === 'string') return data.error;
            if (typeof data?.error?.message === 'string') return data.error.message;
            if (typeof data?.message === 'string') return data.message;
            return fallback;
        }
        function getAuthToken() {
            try {
                return window.localStorage?.getItem(AUTH_TOKEN_KEY) || '';
            } catch {
                return '';
            }
        }
        function withAuthOptions(options = {}) {
            const token = getAuthToken();
            const headers = { ...(options.headers || {}) };
            if (token && !headers.Authorization && !headers.authorization) {
                headers.Authorization = `Bearer ${token}`;
            }
            return {
                ...options,
                credentials: 'include',
                headers
            };
        }
        async function apiFetch(url, options = {}) {
            return await fetch(url, withAuthOptions(options));
        }
        function setView(name) {
            Object.entries(views).forEach(([key, el]) => el.classList.toggle('active', key === name));
            renderBreadcrumbs(name);
        }
        function badgeClass(status) {
            if (['failed', 'needs_action'].includes(status)) return 'bad';
            if (['waiting_human', 'running'].includes(status)) return 'warn';
            if (['success', 'closed'].includes(status)) return 'good';
            return 'neutral';
        }
        function plannedSources(workflow) {
            return workflow.context_sources || workflow.contextSources || [];
        }
        function resolvedSources(workflow) {
            return workflow.latest_context_snapshots || workflow.context_snapshots || [];
        }
        function contextText(sources) {
            return Array.isArray(sources) && sources.length
                ? sources.map((source) => `${source.source_type || 'context'}:${source.source_ref || '-'}`).join(', ')
                : '-';
        }
        function resolvedContextText(sources) {
            return Array.isArray(sources) && sources.length
                ? sources.map((source) => `${source.source_type || 'context'}:${source.source_ref || '-'} (${source.status || 'resolved'})`).join(', ')
                : 'No run context yet';
        }
        function allProjectIds() {
            const ids = new Set();
            state.projects.forEach((project) => ids.add(project.id || project.code || project.name));
            state.workflows.forEach((workflow) => ids.add(workflow.project_id));
            return [...ids].filter(Boolean).sort();
        }
        function projectWorkflows(projectId) {
            return state.workflows.filter((workflow) => workflow.project_id === projectId);
        }
        function projectSummary(projectId) {
            const workflows = projectWorkflows(projectId);
            const contextCount = workflows.reduce((count, workflow) => count + plannedSources(workflow).length, 0);
            const human = workflows.filter((workflow) => workflow.latest_run?.human_waiting).length;
            const action = workflows.filter((workflow) => workflow.latest_run && workflow.latest_run.action_required !== 'none').length;
            const failed = workflows.filter((workflow) => workflow.latest_run?.status === 'failed').length;
            return { workflows, contextCount, human, action, failed };
        }
        function orderedWorkflows() {
            const priority = (workflow) => {
                const run = workflow.latest_run || {};
                if (run.human_waiting) return 0;
                if (run.action_required && run.action_required !== 'none') return 1;
                if (run.status === 'failed' || run.status === 'needs_action') return 2;
                if (run.status === 'running') return 3;
                if (run.status === 'success') return 6;
                return 5;
            };
            return [...state.workflows].sort((a, b) => priority(a) - priority(b));
        }
        function renderBreadcrumbs(view) {
            const parts = [`<button type="button" data-action="home">⌂ Workspace</button>`];
            if (state.selectedProjectId) parts.push(`<span>/</span><button type="button" data-action="project">${escapeHtml(state.selectedProjectId)}</button>`);
            if (state.selectedWorkflowId) parts.push(`<span>/</span><button type="button" data-action="workflow">${escapeHtml(state.workflowDetail?.workflow?.name || state.selectedWorkflowId)}</button>`);
            if (view === 'run' && state.selectedRunId) parts.push(`<span>/</span><span>${escapeHtml(state.selectedRunId)}</span>`);
            breadcrumbs.innerHTML = parts.join('');
        }
        function renderProjectOptions() {
            const current = filterEl.value;
            filterEl.innerHTML = '<option value="">All projects</option>' + allProjectIds().map((id) => `<option value="${escapeHtml(id)}">${escapeHtml(id)}</option>`).join('');
            filterEl.value = allProjectIds().includes(current) ? current : '';
        }
        function renderWorkspace() {
            state.selectedProjectId = '';
            state.selectedWorkflowId = '';
            state.selectedRunId = '';
            const projectIds = allProjectIds();
            const action = state.workflows.filter((workflow) => workflow.latest_run && workflow.latest_run.action_required !== 'none').length;
            const human = state.workflows.filter((workflow) => workflow.latest_run?.human_waiting).length;
            const failed = state.workflows.filter((workflow) => workflow.latest_run?.status === 'failed').length;
            views.workspace.innerHTML = `
                <div class="view-header">
                    <div>
                        <h1>Workflow Mission Control</h1>
                        <div class="meta-row">
                            <span>${projectIds.length} projects</span>
                            <span>${state.workflows.length} workflows</span>
                            <span>${action} action required</span>
                            <span>${human} human waiting</span>
                            <span>${failed} failed</span>
                        </div>
                    </div>
                    <button class="btn primary" type="button" data-action="focus-first-project">＋ Add Workflow</button>
                </div>
                <div class="section-title"><h2>プロジェクト</h2><div class="chips"><span class="badge">稼働中 (${projectIds.length})</span><span class="badge">アーカイブ (0)</span></div></div>
                <div class="project-grid">
                    ${projectIds.map(renderProjectCard).join('')}
                </div>
                <div class="section-title"><h2>Operational Inbox</h2><span class="sub">Human waiting / action required / failed を横断表示</span></div>
                <div class="stack">${orderedWorkflows().map(renderWorkflowCard).join('') || '<div class="empty">No workflow activity</div>'}</div>
            `;
            setView('workspace');
        }
        function renderProjectCard(projectId) {
            const summary = projectSummary(projectId);
            const stateText = summary.human ? `${summary.human} human waiting` : summary.action ? `${summary.action} action required` : summary.failed ? `${summary.failed} failed` : 'healthy';
            return `
                <button class="card-button" type="button" data-project-id="${escapeHtml(projectId)}">
                    <span>▣</span>
                    <span><strong>${escapeHtml(projectId)}</strong><br><span class="sub">${summary.contextCount} context · ${summary.workflows.length} workflow</span><br><span class="badge ${badgeClass(summary.failed ? 'failed' : summary.human ? 'waiting_human' : 'success')}">${escapeHtml(stateText)}</span></span>
                    <span>⋮</span>
                </button>
            `;
        }
        function renderWorkflowCard(workflow) {
            const run = workflow.latest_run || {};
            const status = run.status || 'not_run';
            return `
                <button class="workflow-card" type="button" data-workflow-id="${escapeHtml(workflow.id)}">
                    <span>⌁</span>
                    <span>
                        <strong>${escapeHtml(workflow.name || workflow.id)}</strong>
                        <span class="sub">Project: ${escapeHtml(workflow.project_id)} / Owner: ${escapeHtml(workflow.owner_id || '-')}</span>
                        <span class="sub">Action: ${escapeHtml(run.action_required || 'none')} · Human waiting: ${run.human_waiting ? 'yes' : 'no'}</span>
                        <span class="sub">Planned context: ${escapeHtml(contextText(plannedSources(workflow)))}</span>
                        <span class="sub">Resolved context: ${escapeHtml(resolvedContextText(resolvedSources(workflow)))}</span>
                        <span class="chips"><span class="badge ${badgeClass(status)}">${escapeHtml(status)}</span><span class="badge">${plannedSources(workflow).length} context</span></span>
                    </span>
                    <span>⋮</span>
                </button>
            `;
        }
        function renderProject(projectId) {
            state.selectedProjectId = projectId;
            state.selectedWorkflowId = '';
            state.selectedRunId = '';
            state.workflowDraft = null;
            state.workflowDraftTest = null;
            filterEl.value = projectId;
            const workflows = projectWorkflows(projectId);
            const contextSources = workflows.flatMap((workflow) => plannedSources(workflow).map((source) => ({ ...source, workflowId: workflow.id })));
            views.project.innerHTML = `
                <div class="view-header">
                    <div class="view-heading">
                        <button class="btn soft inline-back" type="button" data-action="home">← Workspace</button>
                        <h1>${escapeHtml(projectId)}</h1>
                        <div class="meta-row"><span>${workflows.length} workflow</span><span>${contextSources.length} context binding</span><span>No local path</span></div>
                    </div>
                    <button class="btn primary" type="button" data-action="focus-workflow-draft">＋ Add Workflow</button>
                </div>
                <div class="layout-two">
                    <section>
                        <div class="section-title"><h2>ワークフロー</h2></div>
                        <div class="stack">${workflows.map(renderWorkflowCard).join('') || '<div class="empty">No workflows in this project</div>'}</div>
                    </section>
                    <section class="panel">
                        <div class="panel-title"><h3>Workflow Draft Builder</h3><span class="badge">Project固定</span></div>
                        <form id="workflow-draft-form" class="field-grid">
                            <label class="full">やりたいこと<textarea name="prompt" required placeholder="例: 毎朝、予定と未完了タスクをまとめるワークフローを作りたい"></textarea></label>
                            <input type="hidden" name="project_id" value="${escapeHtml(projectId)}">
                            <div class="full toolbar">
                                <button class="btn primary" type="submit">Generate Draft</button>
                                <button class="btn soft" type="button" data-action="test-draft" disabled>Test</button>
                                <button class="btn soft" type="button" data-action="publish-draft" disabled>Publish</button>
                            </div>
                        </form>
                        <div class="draft-status" id="workflow-draft-status"></div>
                        <div class="draft-preview" id="workflow-draft-preview"></div>
                    </section>
                </div>
                <section class="section-title"><h2>ドキュメント / Context</h2></section>
                <div class="row-table">
                    <div class="row row-head"><span>名前</span><span>パス / 参照</span><span>Binding</span></div>
                    ${contextSources.map((source) => `<div class="row"><span>${escapeHtml(source.source_type || 'context')}</span><span>${escapeHtml(source.source_ref || '-')}</span><span>${escapeHtml(source.workflowId || '-')}</span></div>`).join('') || '<div class="row"><span>No context</span><span>-</span><span>-</span></div>'}
                </div>
            `;
            setView('project');
        }
        async function renderWorkflow(workflowId) {
            state.selectedWorkflowId = workflowId;
            state.selectedRunId = '';
            views.workflow.innerHTML = '<div class="empty">Loading workflow...</div>';
            setView('workflow');
            try {
                const response = await apiFetch(`/api/workflows/${encodeURIComponent(workflowId)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                state.workflowDetail = await response.json();
            } catch (error) {
                views.workflow.innerHTML = `<div class="error">Workflow を読み込めません: ${escapeHtml(error.message)}</div>`;
                return;
            }
            const workflow = state.workflowDetail.workflow;
            state.selectedProjectId = workflow.project_id;
            const contextSources = state.workflowDetail.context_sources || workflow.context_sources || [];
            const runs = state.workflowDetail.runs || [];
            views.workflow.innerHTML = `
                <div class="view-header">
                    <div class="view-heading">
                        <button class="btn soft inline-back" type="button" data-action="project">← ${escapeHtml(workflow.project_id)}</button>
                        <h1>${escapeHtml(workflow.name || workflow.id)}</h1>
                        <div class="meta-row"><span>Project: ${escapeHtml(workflow.project_id)}</span><span>Owner: ${escapeHtml(workflow.owner_id)}</span><span>Risk: ${escapeHtml(workflow.risk_level || 'low')}</span><span>HITL: ${escapeHtml(workflow.hitl_policy || 'none')}</span></div>
                    </div>
                    <div class="toolbar"><button class="btn soft" type="button" data-action="run-workflow" data-workflow-id="${escapeHtml(workflow.id)}">▷ 実行</button><button class="btn primary" type="button" disabled>保存</button></div>
                </div>
                <div class="layout-two">
                    <section class="panel">
                        <div class="panel-title"><h3>Builder / Canvas</h3><span class="badge">preview</span></div>
                        <div class="canvas"><div class="canvas-row"><div class="node"><div class="node-title">スタート</div><div class="node-copy">Project: ${escapeHtml(workflow.project_id)}</div></div><div class="connector"></div><div class="node"><div class="node-title">Context</div><div class="node-copy">${escapeHtml(contextText(contextSources))}</div></div><div class="connector"></div><div class="node"><div class="node-title">実行</div><div class="node-copy">${escapeHtml(workflow.implementation_key || 'manual-placeholder')}</div></div><div class="connector"></div><div class="node"><div class="node-title">Output / Human</div><div class="node-copy">${escapeHtml(workflow.hitl_policy || 'none')}</div></div></div></div>
                    </section>
                    <section class="panel">
                        <div class="panel-title"><h3>Context sources</h3></div>
                        <div class="trace-list">${contextSources.map((source) => `<div class="trace-item"><strong>${escapeHtml(source.source_type || 'context')}</strong><div class="sub">${escapeHtml(source.source_ref || '-')}</div><div class="chips"><span class="badge ${source.required ? 'warn' : ''}">${source.required ? 'required' : 'optional'}</span><span class="badge">${escapeHtml(source.permission || 'read')}</span></div></div>`).join('') || '<div class="empty">No context bound</div>'}</div>
                    </section>
                </div>
                <section class="section-title"><h2>Runs / Trace</h2></section>
                <div class="row-table">
                    <div class="row row-head"><span>Status</span><span>Started</span><span>Action</span></div>
                    ${runs.map((run) => `<button class="row-button" type="button" data-run-id="${escapeHtml(run.id)}"><span><strong>${escapeHtml(run.status)}</strong><br><span class="sub">${escapeHtml(run.id)}</span></span><span>${escapeHtml(run.started_at || run.created_at || '-')}</span><span>${escapeHtml(run.action_required || 'none')}</span></button>`).join('') || '<div class="row"><span>No runs yet</span><span>-</span><span>-</span></div>'}
                </div>
            `;
            setView('workflow');
        }
        async function renderRun(runId) {
            state.selectedRunId = runId;
            views.run.innerHTML = '<div class="empty">Loading run trace...</div>';
            setView('run');
            try {
                const response = await apiFetch(`/api/workflow-runs/${encodeURIComponent(runId)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                state.runDetail = await response.json();
            } catch (error) {
                views.run.innerHTML = `<div class="error">Run を読み込めません: ${escapeHtml(error.message)}</div>`;
                return;
            }
            const { run, run_steps = [], context_snapshots = [], human_steps = [], outputs = [], audit_logs = [] } = state.runDetail;
            state.selectedProjectId = run.project_id;
            state.selectedWorkflowId = run.workflow_id;
            views.run.innerHTML = `
                <div class="view-header">
                    <div class="view-heading">
                        <button class="btn soft inline-back" type="button" data-action="workflow">← Workflow</button>
                        <h1>Run Trace</h1>
                        <div class="meta-row"><span>${escapeHtml(run.id)}</span><span>${escapeHtml(run.status)}</span><span>${escapeHtml(run.trigger_type || '-')}</span><span>${escapeHtml(run.env || '-')}</span></div>
                    </div>
                    <button class="btn soft" type="button" data-action="rerun" data-run-id="${escapeHtml(run.id)}">↻ Rerun</button>
                </div>
                <div class="layout-two">
                    <section class="panel"><div class="panel-title"><h3>Step timeline</h3></div><div class="trace-list">${run_steps.map((step) => `<div class="trace-item"><strong>${escapeHtml(step.step_name || step.step_key || step.id)}</strong><div class="sub">${escapeHtml(step.status)} · ${escapeHtml(step.message || step.error_message || '-')}</div></div>`).join('') || '<div class="empty">No step trace</div>'}</div></section>
                    <section class="panel"><div class="panel-title"><h3>Resolved context</h3></div><div class="trace-list">${context_snapshots.map((snapshot) => `<div class="trace-item"><strong>${escapeHtml(snapshot.source_type || 'context')}</strong><div class="sub">${escapeHtml(snapshot.source_ref || '-')}</div><div class="sub">${escapeHtml(snapshot.preview || '')}</div></div>`).join('') || '<div class="empty">No context snapshot</div>'}</div></section>
                </div>
                <div class="layout-two" style="margin-top:18px;">
                    <section class="panel"><div class="panel-title"><h3>Outputs</h3></div><div class="trace-list">${outputs.map((output) => `<div class="trace-item"><strong>${escapeHtml(output.title || output.type || output.id)}</strong><div class="sub">${escapeHtml(output.preview || output.content_ref || '-')}</div></div>`).join('') || '<div class="empty">No outputs</div>'}</div></section>
                    <section class="panel"><div class="panel-title"><h3>Human / Audit</h3></div><div class="trace-list">
                        ${human_steps.map((step) => `<div class="trace-item"><strong>${escapeHtml(step.step_type || 'human')}</strong><div class="sub">${escapeHtml(step.status)} · ${escapeHtml(step.prompt || '-')}</div>${step.status === 'pending' ? `<div class="toolbar"><button class="btn soft" type="button" data-action="resolve-human-step" data-resolution="approved" data-run-id="${escapeHtml(run.id)}" data-step-id="${escapeHtml(step.id)}">Approve</button><button class="btn soft" type="button" data-action="resolve-human-step" data-resolution="rejected" data-run-id="${escapeHtml(run.id)}" data-step-id="${escapeHtml(step.id)}">Reject</button></div>` : ''}</div>`).join('')}
                        ${audit_logs.map((log) => `<div class="trace-item"><strong>${escapeHtml(log.action)}</strong><div class="sub">${escapeHtml(log.created_at || '-')}</div></div>`).join('') || '<div class="empty">No audit logs</div>'}
                    </div></section>
                </div>
            `;
            setView('run');
        }
        async function createWorkflow(form) {
            const statusEl = document.getElementById('create-workflow-status');
            const formData = new FormData(form);
            const name = String(formData.get('name') || '').trim();
            const projectId = String(formData.get('project_id') || '').trim();
            const sourceType = String(formData.get('source_type') || 'project');
            const sourceRef = String(formData.get('source_ref') || projectId);
            const id = `wf_${projectId}_${name}`.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80);
            statusEl.textContent = 'Saving...';
            try {
                const response = await apiFetch('/api/workflows', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, name, project_id: projectId, description: String(formData.get('description') || ''), risk_level: String(formData.get('risk_level') || 'low'), context_sources: [{ source_type: sourceType, source_ref: sourceRef, required: true, preview: sourceRef }] })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                statusEl.textContent = 'Saved';
                await load({ keepView: true });
                renderProject(projectId);
            } catch (error) {
                statusEl.textContent = `保存できません: ${error.message}`;
            }
        }
        function setDraftButtons({ canTest = false, canPublish = false } = {}) {
            const testButton = document.querySelector('[data-action="test-draft"]');
            const publishButton = document.querySelector('[data-action="publish-draft"]');
            if (testButton) testButton.disabled = !canTest;
            if (publishButton) publishButton.disabled = !canPublish;
        }
        function renderDraftPreview() {
            const previewEl = document.getElementById('workflow-draft-preview');
            const statusEl = document.getElementById('workflow-draft-status');
            if (!previewEl) return;
            const draft = state.workflowDraft;
            if (!draft) {
                previewEl.innerHTML = '';
                setDraftButtons();
                return;
            }
            const workflow = draft.workflow || {};
            const nodes = draft.builder_preview?.nodes || [];
            const testResult = state.workflowDraftTest;
            if (statusEl) statusEl.textContent = testResult
                ? `Test: ${testResult.status} / ${testResult.message}`
                : 'Draft generated. Test before publish.';
            previewEl.innerHTML = `
                <div class="trace-item">
                    <strong>${escapeHtml(workflow.name || workflow.id)}</strong>
                    <div class="sub">${escapeHtml(workflow.description || '')}</div>
                    <div class="chips">
                        <span class="badge">draft</span>
                        <span class="badge">${escapeHtml(workflow.risk_level || 'low')}</span>
                        <span class="badge">${escapeHtml(workflow.hitl_policy || 'none')}</span>
                        <span class="badge">${escapeHtml(workflow.project_id || '-')}</span>
                    </div>
                </div>
                <div class="canvas"><div class="canvas-row">
                    ${nodes.map((node, index) => `${index ? '<div class="connector"></div>' : ''}<div class="node"><div class="node-title">${escapeHtml(node.label || node.id)}</div><div class="node-copy">${escapeHtml(node.summary || node.type || '')}</div></div>`).join('')}
                </div></div>
                <div class="trace-list">
                    ${(draft.context_sources || []).map((source) => `<div class="trace-item"><strong>${escapeHtml(source.source_type || 'context')}</strong><div class="sub">${escapeHtml(source.source_ref || '-')}</div><div class="chips"><span class="badge">${escapeHtml(source.permission || 'read')}</span><span class="badge ${source.required ? 'warn' : ''}">${source.required ? 'required' : 'optional'}</span></div></div>`).join('')}
                </div>
            `;
            setDraftButtons({
                canTest: true,
                canPublish: testResult?.status === 'passed'
            });
        }
        async function generateWorkflowDraft(form) {
            const statusEl = document.getElementById('workflow-draft-status');
            const formData = new FormData(form);
            const prompt = String(formData.get('prompt') || '').trim();
            const projectId = String(formData.get('project_id') || '').trim();
            if (statusEl) statusEl.textContent = 'Generating draft...';
            state.workflowDraft = null;
            state.workflowDraftTest = null;
            renderDraftPreview();
            try {
                const response = await apiFetch('/api/workflows/draft', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_id: projectId, prompt })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(errorMessage(data, `HTTP ${response.status}`));
                state.workflowDraft = data.draft;
                if (statusEl) statusEl.textContent = 'Draft generated. Test before publish.';
                renderDraftPreview();
            } catch (error) {
                if (statusEl) statusEl.innerHTML = `<span class="error" style="display:block;">Draft生成に失敗しました: ${escapeHtml(error.message)}</span>`;
                setDraftButtons();
            }
        }
        async function testDraft() {
            const statusEl = document.getElementById('workflow-draft-status');
            if (!state.workflowDraft) return;
            if (statusEl) statusEl.textContent = 'Testing draft...';
            try {
                const response = await apiFetch('/api/workflows/draft/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ draft: state.workflowDraft })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(errorMessage(data, `HTTP ${response.status}`));
                state.workflowDraftTest = data.test_result;
                renderDraftPreview();
            } catch (error) {
                if (statusEl) statusEl.innerHTML = `<span class="error" style="display:block;">Draft testに失敗しました: ${escapeHtml(error.message)}</span>`;
                setDraftButtons({ canTest: true, canPublish: false });
            }
        }
        async function publishDraft() {
            const statusEl = document.getElementById('workflow-draft-status');
            if (!state.workflowDraft?.workflow) return;
            if (statusEl) statusEl.textContent = 'Publishing workflow...';
            try {
                const response = await apiFetch('/api/workflows', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state.workflowDraft.workflow)
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(errorMessage(data, `HTTP ${response.status}`));
                if (statusEl) statusEl.textContent = 'Published';
                await load({ keepView: true });
                await renderWorkflow(data.workflow.id);
            } catch (error) {
                if (statusEl) statusEl.innerHTML = `<span class="error" style="display:block;">Publishに失敗しました: ${escapeHtml(error.message)}</span>`;
            }
        }
        async function runWorkflow(workflowId) {
            const response = await apiFetch(`/api/workflows/${encodeURIComponent(workflowId)}/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trigger_type: 'manual', env: 'local' }) });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            await load({ keepView: true });
            await renderRun(result.run.id);
        }
        async function rerun(runId) {
            const response = await apiFetch(`/api/workflow-runs/${encodeURIComponent(runId)}/rerun`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            await load({ keepView: true });
            await renderRun(result.run.id);
        }
        async function resolveHumanStep(runId, stepId, resolution) {
            const response = await apiFetch(`/api/workflow-runs/${encodeURIComponent(runId)}/human-steps/${encodeURIComponent(stepId)}/resolve`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ resolution }) });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            await load({ keepView: true });
            await renderRun(result.resumed_run?.id || runId);
        }
        async function load({ keepView = false } = {}) {
            if (!keepView) {
                views.workspace.innerHTML = '<div class="empty">Loading workflows...</div>';
                setView('workspace');
            }
            try {
                const [projectsResponse, workflowsResponse] = await Promise.all([
                    apiFetch('/api/config/projects').catch(() => null),
                    apiFetch('/api/workflows')
                ]);
                if (projectsResponse?.ok) {
                    const projectData = await projectsResponse.json();
                    state.projects = Array.isArray(projectData.projects) ? projectData.projects.filter((project) => !project.archived) : [];
                }
                if (workflowsResponse.status === 401) {
                    views.workspace.innerHTML = '<div class="error">ログインが必要です。<div class="toolbar" style="margin-top:12px;"><a class="btn soft" href="/">Brainbase Terminalへ戻る</a></div></div>';
                    setView('workspace');
                    return;
                }
                if (!workflowsResponse.ok) throw new Error(`HTTP ${workflowsResponse.status}`);
                const workflowData = await workflowsResponse.json();
                state.workflows = Array.isArray(workflowData.workflows) ? workflowData.workflows : [];
                renderProjectOptions();
                if (!keepView) renderWorkspace();
            } catch (error) {
                views.workspace.innerHTML = `<div class="error">Workflow を読み込めません: ${escapeHtml(error.message)}</div>`;
                setView('workspace');
            }
        }
        document.addEventListener('click', async (event) => {
            const target = event.target.closest('button, a');
            if (!target) return;
            if (target.dataset.action === 'home') renderWorkspace();
            if (target.dataset.action === 'project' && state.selectedProjectId) renderProject(state.selectedProjectId);
            if (target.dataset.action === 'workflow' && state.selectedWorkflowId) await renderWorkflow(state.selectedWorkflowId);
            if (target.dataset.action === 'focus-first-project') {
                const firstProject = allProjectIds()[0];
                if (firstProject) renderProject(firstProject);
            }
            if (target.dataset.projectId) renderProject(target.dataset.projectId);
            if (target.dataset.workflowId) await renderWorkflow(target.dataset.workflowId);
            if (target.dataset.runId) await renderRun(target.dataset.runId);
            if (target.dataset.action === 'run-workflow') {
                try { await runWorkflow(target.dataset.workflowId); }
                catch (error) { views.workflow.insertAdjacentHTML('afterbegin', `<div class="error">実行できません: ${escapeHtml(error.message)}</div>`); }
            }
            if (target.dataset.action === 'rerun') {
                try { await rerun(target.dataset.runId); }
                catch (error) { views.run.insertAdjacentHTML('afterbegin', `<div class="error">再実行できません: ${escapeHtml(error.message)}</div>`); }
            }
            if (target.dataset.action === 'resolve-human-step') {
                try { await resolveHumanStep(target.dataset.runId, target.dataset.stepId, target.dataset.resolution); }
                catch (error) { views.run.insertAdjacentHTML('afterbegin', `<div class="error">人間判断を処理できません: ${escapeHtml(error.message)}</div>`); }
            }
            if (target.dataset.action === 'test-draft') {
                await testDraft();
            }
            if (target.dataset.action === 'publish-draft') {
                await publishDraft();
            }
            if (target.dataset.action === 'focus-workflow-draft') {
                document.querySelector('#workflow-draft-form textarea[name="prompt"]')?.focus();
                document.getElementById('workflow-draft-form')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
        });
        document.addEventListener('submit', async (event) => {
            if (event.target.id !== 'workflow-draft-form') return;
            event.preventDefault();
            await generateWorkflowDraft(event.target);
        });
        filterEl.addEventListener('change', () => {
            if (filterEl.value) renderProject(filterEl.value);
            else renderWorkspace();
        });
        refreshBtn.addEventListener('click', () => load());
        load();
    </script>
</body>
</html>
