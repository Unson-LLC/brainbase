<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainbase Workflows</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            --bg: #eef2f6;
            --panel: #ffffff;
            --ink: #111418;
            --muted: #667085;
            --line: #20242a;
            --soft-line: #d8dee7;
            --mint: #b7e4dc;
            --accent: #7c4dff;
            --bad: #d92d20;
            --warn: #b7791f;
            --good: #027a48;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }
        .shell {
            display: grid;
            grid-template-columns: 326px 1fr;
            gap: 18px;
            min-height: 100vh;
            padding: 22px;
        }
        .assistant {
            border: 2px solid var(--line);
            border-radius: 26px;
            background: var(--panel);
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .assistant h2 { margin: 0; font-size: 17px; }
        .assistant .hint {
            font-size: 14px;
            line-height: 1.75;
        }
        .assistant textarea {
            width: 100%;
            min-height: 110px;
            border: 0;
            border-top: 1px dashed var(--line);
            padding-top: 18px;
            resize: vertical;
            color: var(--muted);
            font: inherit;
        }
        .surface {
            border: 2px solid var(--line);
            border-radius: 26px;
            overflow: hidden;
            background: #f8fafc;
            min-width: 0;
        }
        .topbar {
            min-height: 48px;
            background: var(--mint);
            border-bottom: 2px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
        }
        .crumbs, .toolbar, .meta-row, .chips, .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .crumbs button, .toolbar button, .toolbar select {
            min-height: 34px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--ink);
            font: inherit;
        }
        .toolbar button, .toolbar select, .btn {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 18px;
            padding: 0 12px;
            cursor: pointer;
        }
        .btn {
            display: inline-flex;
            min-height: 34px;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn.primary {
            background: #121619;
            color: #fff;
        }
        .btn.soft {
            background: #f8fafc;
        }
        .content {
            padding: 34px;
        }
        h1 { margin: 0; font-size: 30px; line-height: 1.2; }
        h2 { margin: 0; font-size: 23px; }
        h3 { margin: 0; font-size: 16px; }
        .sub { color: var(--muted); font-size: 13px; line-height: 1.45; }
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 28px;
        }
        .view-heading {
            display: grid;
            gap: 8px;
        }
        .inline-back {
            width: fit-content;
            min-height: 28px;
            padding: 0 10px;
            font-size: 13px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            border: 1px solid var(--soft-line);
            border-radius: 999px;
            padding: 0 8px;
            font-size: 12px;
            color: var(--muted);
            background: #fff;
        }
        .badge.warn { color: var(--warn); border-color: #f6d58f; }
        .badge.good { color: var(--good); border-color: #a6f4c5; }
        .badge.bad { color: var(--bad); border-color: #fecdca; }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .card-button, .panel, .row-table {
            border: 2px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }
        .card-button {
            min-height: 96px;
            padding: 18px;
            text-align: left;
            display: grid;
            grid-template-columns: 28px 1fr 20px;
            gap: 12px;
            align-items: center;
            cursor: pointer;
        }
        .workflow-card {
            width: 100%;
            min-height: 96px;
            padding: 18px;
            text-align: left;
            display: grid;
            grid-template-columns: 28px 1fr 20px;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            border: 2px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }
        .stack { display: grid; gap: 14px; }
        .layout-two {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(300px, 0.85fr);
            gap: 18px;
        }
        .panel {
            padding: 18px;
        }
        .panel-title {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px;
        }
        .section-title {
            justify-content: space-between;
            margin: 28px 0 14px;
        }
        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .field-grid .full { grid-column: 1 / -1; }
        label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
        input, select, textarea {
            min-height: 36px;
            border: 1px solid var(--soft-line);
            border-radius: 6px;
            padding: 0 10px;
            background: #fff;
            color: var(--ink);
            font: inherit;
        }
        .row-table { overflow: hidden; }
        .row, .row-button {
            display: grid;
            grid-template-columns: 1fr 190px 150px;
            gap: 12px;
            width: 100%;
            padding: 14px 18px;
            border: 0;
            border-top: 1px solid var(--soft-line);
            background: #fff;
            text-align: left;
            font: inherit;
        }
        .row-head { color: var(--muted); background: #f8fafc; border-top: 0; }
        .canvas {
            min-height: 230px;
            background-image: linear-gradient(#e8edf3 1px, transparent 1px), linear-gradient(90deg, #e8edf3 1px, transparent 1px);
            background-size: 24px 24px;
            border: 1px solid var(--soft-line);
            overflow: auto;
            padding: 42px;
        }
        .canvas-row {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 820px;
        }
        .node {
            min-width: 180px;
            border: 2px solid #000;
            border-radius: 8px;
            background: #fff;
            padding: 14px;
            box-shadow: 3px 4px 0 #000;
        }
        .node-title { font-weight: 800; margin-bottom: 6px; }
        .node-copy { color: var(--muted); font-size: 12px; }
        .connector { height: 2px; min-width: 40px; background: #000; }
        .trace-list { display: grid; gap: 10px; }
        .trace-item {
            border: 1px solid var(--soft-line);
            border-radius: 6px;
            padding: 12px;
            background: #fff;
        }
        .meeting-pack {
            display: grid;
            gap: 14px;
            margin-bottom: 16px;
        }
        .meeting-pack-hero {
            border: 2px solid var(--line);
            border-radius: 10px;
            background: #fff;
            padding: 16px;
            display: grid;
            gap: 12px;
        }
        .meeting-pack-title {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .meeting-pack-title h4 {
            margin: 0;
            font-size: 18px;
        }
        .meeting-pack-title p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
            max-width: 720px;
        }
        .meeting-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
            gap: 10px;
        }
        .meeting-metric {
            border: 1px solid var(--soft-line);
            border-radius: 8px;
            background: #f8fafc;
            padding: 10px;
        }
        .meeting-metric strong {
            display: block;
            font-size: 20px;
        }
        .meeting-metric span {
            color: var(--muted);
            font-size: 11px;
        }
        .meeting-lifecycle {
            display: grid;
            grid-template-columns: repeat(5, minmax(150px, 1fr));
            gap: 8px;
        }
        .meeting-definition-card {
            border: 1px solid var(--soft-line);
            border-radius: 8px;
            background: #fff;
            padding: 12px;
            display: grid;
            gap: 8px;
        }
        .meeting-definition-card strong {
            font-size: 13px;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }
        .meeting-definition-card .sub {
            display: block;
        }
        .trigger-lanes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }
        .trigger-lane {
            border: 1px solid var(--soft-line);
            border-radius: 8px;
            background: #fff;
            padding: 12px;
            display: grid;
            gap: 8px;
            align-content: start;
        }
        .trigger-lane h4 {
            margin: 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0;
        }
        .human-gate-queue {
            display: grid;
            gap: 8px;
        }
        .human-gate-item {
            border: 1px solid var(--soft-line);
            border-radius: 8px;
            background: #fffaf0;
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
        }
        .human-gate-item.high {
            background: #fff7f6;
            border-color: #fecdca;
        }
        .guardrail-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .guardrail-list .badge {
            border-color: #20242a;
            color: #111418;
        }
        .draft-preview {
            display: grid;
            gap: 12px;
            margin-top: 14px;
        }
        .draft-preview .canvas {
            min-height: 180px;
            padding: 28px;
        }
        .draft-status {
            min-height: 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .error, .empty {
            border: 2px solid var(--line);
            border-radius: 8px;
            background: #fff;
            padding: 18px;
        }
        .error { color: var(--bad); }
        .view { display: none; }
        .view.active { display: block; }
        @media (max-width: 980px) {
            .shell { grid-template-columns: 1fr; padding: 12px; }
            .assistant { display: none; }
            .project-grid, .layout-two, .meeting-lifecycle { grid-template-columns: 1fr; }
            .content { padding: 22px; }
            .row, .row-button { grid-template-columns: 1fr; }
        }
        body.embedded {
            min-height: 100vh;
        }
        body.embedded .shell {
            display: block;
            min-height: 100vh;
            padding: 0;
        }
        body.embedded .assistant,
        body.embedded .topbar,
        body.embedded .terminal-return-link {
            display: none;
        }
        body.embedded .surface {
            min-height: 100vh;
            border: 0;
            border-radius: 0;
        }
        body.embedded .content {
            padding: 20px 24px 24px;
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="assistant" aria-label="AI assistant">
            <div class="toolbar">
                <h2>新しいワークフローを作りたい</h2>
                <a href="/" aria-label="Brainbase home">⌂</a>
            </div>
            <div class="hint">
                <strong>目的・入力・出力</strong>を1文ずつ決めると、Project 配下の workflow として整理できます。
            </div>
            <div class="hint">
                Project を選び、その中で workflow、document/context、run trace を確認します。Canvas は設計の見取り図で、実行証跡は Run detail が正本です。
            </div>
            <textarea id="assistant-draft" placeholder="例: 毎朝、予定と未完了タスクをまとめるワークフローを作りたい" aria-label="AIアシスタントに質問してください"></textarea>
        </aside>

        <main class="surface">
            <nav class="topbar" aria-label="Workflow navigation">
                <div class="crumbs" id="breadcrumbs"></div>
                <div class="toolbar">
                    <a class="btn soft terminal-return-link" href="/" aria-label="Brainbase terminalへ戻る">Terminalへ戻る</a>
                    <select id="project-filter" aria-label="Project filter"><option value="">All projects</option></select>
                    <button id="refresh-btn" type="button">Refresh</button>
                </div>
            </nav>
            <div class="content">
                <section id="workspace-view" class="view active"></section>
                <section id="project-view" class="view"></section>
                <section id="workflow-view" class="view"></section>
                <section id="run-view" class="view"></section>
            </div>
        </main>
    </div>

    <script type="module">
        const embeddedMode = new URLSearchParams(window.location.search).get('embedded') === '1';
        if (embeddedMode) document.body.classList.add('embedded');

        const state = {
            projects: [],
            workflows: [],
            selectedProjectId: '',
            selectedWorkflowId: '',
            selectedRunId: '',
            workflowDetail: null,
            runDetail: null,
            workflowDraft: null,
            workflowDraftTest: null,
            workflowControl: {},
            meetingPackBootstrapStatus: {}
        };
        const views = {
            workspace: document.getElementById('workspace-view'),
            project: document.getElementById('project-view'),
            workflow: document.getElementById('workflow-view'),
            run: document.getElementById('run-view')
        };
        const breadcrumbs = document.getElementById('breadcrumbs');
        const filterEl = document.getElementById('project-filter');
        const refreshBtn = document.getElementById('refresh-btn');
        const AUTH_TOKEN_KEY = 'brainbase.auth.token';
        let csrfToken = '';
        let csrfTokenPromise = null;
        const MEETING_WORKFLOW_DEFINITIONS = [
            {
                id: 'pre-meeting-briefing',
                name: 'Pre-Meeting Briefing',
                label: 'MTG前準備',
                trigger: 'schedule',
                also: ['human'],
                output: 'agenda / context brief',
                humanGate: 'optional_before_share',
                writeBack: 'Workflow output',
                risk: 'low'
            },
            {
                id: 'transcript-to-meeting-note',
                name: 'Transcript → Meeting Note',
                label: '議事録ドラフト生成',
                trigger: 'event',
                also: ['human'],
                output: 'meeting note draft',
                humanGate: 'required_before_publish',
                writeBack: 'Meeting Note draft',
                risk: 'medium'
            },
            {
                id: 'meeting-note-to-tasks',
                name: 'Meeting Note → Tasks',
                label: 'タスク候補抽出',
                trigger: 'event',
                also: ['human'],
                output: 'task candidates',
                humanGate: 'required_before_task_create',
                writeBack: 'Task Store',
                risk: 'medium'
            },
            {
                id: 'meeting-note-to-decisions',
                name: 'Meeting Note → Decisions',
                label: 'Decision昇格候補',
                trigger: 'human',
                also: ['event'],
                output: 'decision candidates',
                humanGate: 'required_before_graph_promotion',
                writeBack: 'Graph SSOT',
                risk: 'high'
            },
            {
                id: 'post-meeting-follow-up-message',
                name: 'Post-Meeting Follow-up',
                label: 'MTG後挨拶文',
                trigger: 'human',
                also: ['event'],
                output: 'message draft',
                humanGate: 'required_before_external_send',
                writeBack: 'External channel',
                risk: 'high'
            }
        ];
        const MEETING_GUARDRAILS = [
            'Graph SSOT昇格はHuman Gate後',
            '外部送信はapproval必須',
            'event retryで重複作成しない',
            'private channel / 限定scopeのleak防止'
        ];

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }
        function errorMessage(data, fallback) {
            if (typeof data?.error === 'string') return data.error;
            if (typeof data?.error?.message === 'string') return data.error.message;
            if (typeof data?.message === 'string') return data.message;
            return fallback;
        }
        function getAuthToken() {
            try {
                return window.localStorage?.getItem(AUTH_TOKEN_KEY) || '';
            } catch {
                return '';
            }
        }
        function withAuthOptions(options = {}) {
            const token = getAuthToken();
            const headers = { ...(options.headers || {}) };
            if (token && !headers.Authorization && !headers.authorization) {
                headers.Authorization = `Bearer ${token}`;
            }
            return {
                ...options,
                credentials: 'include',
                headers
            };
        }
        function isUnsafeMethod(method) {
            return !['GET', 'HEAD', 'OPTIONS'].includes(String(method || 'GET').toUpperCase());
        }
        async function getCsrfToken() {
            if (csrfToken) return csrfToken;
            if (!csrfTokenPromise) {
                csrfTokenPromise = fetch('/api/csrf-token', withAuthOptions({ headers: { Accept: 'application/json' } }))
                    .then(async (response) => {
                        if (!response.ok) throw new Error(`CSRF ${response.status}`);
                        const data = await response.json();
                        csrfToken = data.token || data.csrfToken || '';
                        return csrfToken;
                    })
                    .finally(() => {
                        csrfTokenPromise = null;
                    });
            }
            return csrfTokenPromise;
        }
        async function apiFetch(url, options = {}) {
            const requestOptions = withAuthOptions(options);
            if (isUnsafeMethod(requestOptions.method)) {
                const headers = { ...(requestOptions.headers || {}) };
                if (!headers['x-csrf-token'] && !headers['X-CSRF-Token']) {
                    headers['x-csrf-token'] = await getCsrfToken();
                }
                requestOptions.headers = headers;
            }
            return await fetch(url, requestOptions);
        }
        function setView(name) {
            Object.entries(views).forEach(([key, el]) => el.classList.toggle('active', key === name));
            renderBreadcrumbs(name);
        }
        function badgeClass(status) {
            if (['failed', 'needs_action'].includes(status)) return 'bad';
            if (['waiting_human', 'running'].includes(status)) return 'warn';
            if (['success', 'closed'].includes(status)) return 'good';
            return 'neutral';
        }
        function plannedSources(workflow) {
            return workflow.context_sources || workflow.contextSources || [];
        }
        function resolvedSources(workflow) {
            return workflow.latest_context_snapshots || workflow.context_snapshots || [];
        }
        function contextText(sources) {
            return Array.isArray(sources) && sources.length
                ? sources.map((source) => `${source.source_type || 'context'}:${source.source_ref || '-'}`).join(', ')
                : '-';
        }
        function resolvedContextText(sources) {
            return Array.isArray(sources) && sources.length
                ? sources.map((source) => `${source.source_type || 'context'}:${source.source_ref || '-'} (${source.status || 'resolved'})`).join(', ')
                : 'No run context yet';
        }
        function allProjectIds() {
            const ids = new Set();
            state.projects.forEach((project) => ids.add(project.id || project.code || project.name));
            state.workflows.forEach((workflow) => ids.add(workflow.project_id));
            return [...ids].filter(Boolean).sort();
        }
        function projectWorkflows(projectId) {
            return state.workflows.filter((workflow) => workflow.project_id === projectId);
        }
        function projectSummary(projectId) {
            const workflows = projectWorkflows(projectId);
            const contextCount = workflows.reduce((count, workflow) => count + plannedSources(workflow).length, 0);
            const human = workflows.filter((workflow) => workflow.latest_run?.human_waiting).length;
            const action = workflows.filter((workflow) => workflow.latest_run && workflow.latest_run.action_required !== 'none').length;
            const failed = workflows.filter((workflow) => workflow.latest_run?.status === 'failed').length;
            return { workflows, contextCount, human, action, failed };
        }
        const WORKFLOW_CONTROL_ENDPOINTS = {
            'role-agents': '/api/workflows/control/role-agents',
            templates: '/api/workflows/control/templates',
            bindings: '/api/workflows/control/bindings',
            triggers: '/api/workflows/control/triggers',
            'loop-intents': '/api/workflows/control/loop-intents'
        };
        function controlEndpoint(resource, params = {}) {
            const query = new URLSearchParams();
            Object.entries(params).forEach(([key, value]) => {
                if (value !== undefined && value !== null && String(value).trim() !== '') {
                    query.set(key, value);
                }
            });
            const endpoint = WORKFLOW_CONTROL_ENDPOINTS[resource] || `/api/workflows/control/${resource}`;
            return `${endpoint}${query.toString() ? `?${query}` : ''}`;
        }
        function controlResourceData(projectId) {
            return state.workflowControl[projectId] || null;
        }
        function summarizeJson(value) {
            if (!value || typeof value !== 'object') return '';
            try {
                return JSON.stringify(value);
            } catch {
                return '';
            }
        }
        function optionList(items, labelKey = 'name', labelFormatter) {
            return (items || []).map((item) => {
                const label = labelFormatter ? labelFormatter(item) : (item[labelKey] || item.name || item.id);
                return `<option value="${escapeHtml(item.id)}">${escapeHtml(label || item.id)}</option>`;
            }).join('');
        }
        function roleAgentOptionLabel(agent) {
            const policy = agent.context_policy?.customer_scope || agent.context_policy?.graph_refs?.join(',');
            const tools = agent.tool_scope?.allow?.join(',');
            const constraints = agent.workflow_constraints?.max_autonomy_level;
            return [agent.name || agent.id, agent.org_id, agent.role_archetype_id, policy && `context:${policy}`, tools && `tools:${tools}`, constraints && `max:${constraints}`].filter(Boolean).join(' · ');
        }
        function bindingOptionLabel(binding) {
            const status = binding.enabled === false ? 'disabled' : 'enabled';
            return [binding.name || binding.id, status, binding.autonomy_level, binding.workflow_selection_reason].filter(Boolean).join(' · ');
        }
        function triggerOptionLabel(trigger) {
            const status = trigger.enabled === false ? 'disabled' : 'enabled';
            return [trigger.name || trigger.id, status, trigger.trigger_type, trigger.workflow_binding_id].filter(Boolean).join(' · ');
        }
        function compactList(items, emptyText, formatter) {
            return (items || []).length
                ? items.map(formatter).join('')
                : `<div class="empty">${escapeHtml(emptyText)}</div>`;
        }
        function triggerBadge(trigger) {
            const tone = trigger === 'schedule' ? 'good' : trigger === 'event' ? 'warn' : '';
            return `<span class="badge ${tone}">${escapeHtml(trigger)}</span>`;
        }
        function riskBadge(risk) {
            const tone = risk === 'high' ? 'bad' : risk === 'medium' ? 'warn' : 'good';
            return `<span class="badge ${tone}">risk ${escapeHtml(risk)}</span>`;
        }
        function meetingDefinitionConfigured(definition, templates) {
            return Boolean(meetingDefinitionTemplate(definition, templates));
        }

        async function bootstrapMeetingWorkflowPack(projectId) {
            const statusEl = document.getElementById('meeting-pack-bootstrap-status');
            if (statusEl) statusEl.textContent = 'Bootstrapping...';
            try {
                const response = await apiFetch('/api/workflows/control/meeting-pack/bootstrap', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        org_id: projectId,
                        project_id: projectId,
                        seed_loop_intents: true
                    })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(errorMessage(data, `HTTP ${response.status}`));
                const pack = data.meeting_workflow_pack || {};
                delete state.meetingPackBootstrapStatus[projectId];
                if (statusEl) {
                    statusEl.textContent = `Connected ${pack.workflow_templates?.length || 0} definitions, ${pack.workflow_triggers?.length || 0} triggers`;
                }
                await loadWorkflowControl(projectId);
            } catch (error) {
                state.meetingPackBootstrapStatus[projectId] = { message: `Bootstrapできません: ${error.message}` };
                if (state.selectedProjectId === projectId) renderWorkflowControlPanel(projectId);
            }
        }
        async function load({ keepView = false } = {}) {
            if (!keepView) {
                views.workspace.innerHTML = '<div class="empty">Loading workflows...</div>';
                setView('workspace');
            }
            try {
                const [projectsResponse, workflowsResponse] = await Promise.all([
                    apiFetch('/api/config/projects').catch(() => null),
                    apiFetch('/api/workflows')
                ]);
                if (projectsResponse?.ok) {
                    const projectData = await projectsResponse.json();
                    state.projects = Array.isArray(projectData.projects) ? projectData.projects.filter((project) => !project.archived) : [];
                }
                if (workflowsResponse.status === 401) {
                    views.workspace.innerHTML = '<div class="error">ログインが必要です。<div class="toolbar" style="margin-top:12px;"><a class="btn soft" href="/">Brainbase Terminalへ戻る</a></div></div>';
                    setView('workspace');
                    return;
                }
                if (!workflowsResponse.ok) throw new Error(`HTTP ${workflowsResponse.status}`);
                const workflowData = await workflowsResponse.json();
                state.workflows = Array.isArray(workflowData.workflows) ? workflowData.workflows : [];
                renderProjectOptions();
                if (!keepView) renderWorkspace();
            } catch (error) {
                views.workspace.innerHTML = `<div class="error">Workflow を読み込めません: ${escapeHtml(error.message)}</div>`;
                setView('workspace');
            }
        }
        document.addEventListener('click', async (event) => {
            const target = event.target.closest('button, a');
            if (!target) return;
            if (target.dataset.action === 'home') renderWorkspace();
            if (target.dataset.action === 'project' && state.selectedProjectId) renderProject(state.selectedProjectId);
            if (target.dataset.action === 'workflow' && state.selectedWorkflowId) await renderWorkflow(state.selectedWorkflowId);
            if (target.dataset.action === 'focus-first-project') {
                const firstProject = allProjectIds()[0];
                if (firstProject) renderProject(firstProject);
            }
            if (target.dataset.projectId) renderProject(target.dataset.projectId);
            if (target.dataset.workflowId) await renderWorkflow(target.dataset.workflowId);
            if (target.dataset.runId) await renderRun(target.dataset.runId);
            if (target.dataset.action === 'run-workflow') {
                try { await runWorkflow(target.dataset.workflowId); }
                catch (error) { views.workflow.insertAdjacentHTML('afterbegin', `<div class="error">実行できません: ${escapeHtml(error.message)}</div>`); }
            }
            if (target.dataset.action === 'rerun') {
                try { await rerun(target.dataset.runId); }
                catch (error) { views.run.insertAdjacentHTML('afterbegin', `<div class="error">再実行できません: ${escapeHtml(error.message)}</div>`); }
            }
            if (target.dataset.action === 'resolve-human-step') {
                try { await resolveHumanStep(target.dataset.runId, target.dataset.stepId, target.dataset.resolution); }
                catch (error) { views.run.insertAdjacentHTML('afterbegin', `<div class="error">人間判断を処理できません: ${escapeHtml(error.message)}</div>`); }
            }
            if (target.dataset.action === 'test-draft') {
                await testDraft();
            }
            if (target.dataset.action === 'publish-draft') {
                await publishDraft();
            }
            if (target.dataset.action === 'focus-workflow-draft') {
                document.querySelector('#workflow-draft-form textarea[name="prompt"]')?.focus();
                document.getElementById('workflow-draft-form')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
            if (target.dataset.action === 'bootstrap-meeting-pack') {
                await bootstrapMeetingWorkflowPack(target.dataset.projectId || state.selectedProjectId);
            }
        });
        document.addEventListener('submit', async (event) => {
            if (event.target.dataset.workflowControlResource) {
                event.preventDefault();
                await createWorkflowControlItem(event.target);
                return;
            }
            if (event.target.id !== 'workflow-draft-form') return;
            event.preventDefault();
            await generateWorkflowDraft(event.target);
        });
        filterEl.addEventListener('change', () => {
            if (filterEl.value) renderProject(filterEl.value);
            else renderWorkspace();
        });
        refreshBtn.addEventListener('click', () => load());
        load();
    </script>
</body>
</html>
