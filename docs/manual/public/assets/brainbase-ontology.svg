<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Brainbaseのオントロジー概念図</title>
  <desc id="desc">人物、組織、プロジェクト、現在の判断、古い判断を安定したIDと関係で接続する概念図</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .node-title { font: 700 20px system-ui, sans-serif; fill: #0f172a; }
      .id { font: 15px ui-monospace, SFMono-Regular, monospace; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .edge-label { font: 600 15px ui-monospace, SFMono-Regular, monospace; fill: #4338ca; paint-order: stroke; stroke: #fff; stroke-width: 6px; }
      .person { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .org { fill: #f0f9ff; stroke: #0ea5e9; stroke-width: 2; }
      .project { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
      .decision { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .old { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1100" height="650" rx="24" fill="#ffffff"/>
  <text x="55" y="58" class="title">会社の対象を、安定IDと関係でつなぐ</text>

  <path d="M270 190 C390 190 390 300 480 300" class="edge"/>
  <text x="335" y="225" class="edge-label">participates_in</text>

  <path d="M270 470 C385 470 390 350 480 330" class="edge"/>
  <text x="340" y="430" class="edge-label">owned_by</text>

  <path d="M830 190 C735 190 735 275 680 290" class="edge"/>
  <text x="718" y="225" class="edge-label">governs</text>

  <path d="M830 440 C830 355 830 305 830 245" class="edge"/>
  <text x="845" y="350" class="edge-label">supersedes</text>

  <rect x="70" y="130" width="200" height="120" rx="20" class="person"/>
  <text x="170" y="178" text-anchor="middle" class="node-title">人物</text>
  <text x="170" y="212" text-anchor="middle" class="id">person:P-21</text>

  <rect x="70" y="410" width="200" height="120" rx="20" class="org"/>
  <text x="170" y="458" text-anchor="middle" class="node-title">組織</text>
  <text x="170" y="492" text-anchor="middle" class="id">org:O-01</text>

  <rect x="480" y="265" width="200" height="120" rx="20" class="project"/>
  <text x="580" y="313" text-anchor="middle" class="node-title">プロジェクト</text>
  <text x="580" y="347" text-anchor="middle" class="id">project:P-03</text>

  <rect x="830" y="130" width="210" height="120" rx="20" class="decision"/>
  <text x="935" y="178" text-anchor="middle" class="node-title">現在の判断</text>
  <text x="935" y="212" text-anchor="middle" class="id">decision:D-12</text>

  <rect x="830" y="410" width="210" height="120" rx="20" class="old"/>
  <text x="935" y="458" text-anchor="middle" class="node-title">古い判断</text>
  <text x="935" y="492" text-anchor="middle" class="id">decision:D-07</text>

  <text x="550" y="595" text-anchor="middle" class="id">表示名が変わっても、IDと関係が同じなら同じ対象としてたどれる</text>
</svg>
