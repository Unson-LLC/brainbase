<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Brainbaseのシステム構成</title>
  <desc id="desc">情報源を人間が確認し、オントロジーとGraph SSOTを意味と事実の中核として、Judgment DAG、人間とAI、実行と結果の証跡へつなぐ構成図</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 14px system-ui, sans-serif; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .semantic { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
      .judgment { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .human { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .result { fill: #f0f9ff; stroke: #0ea5e9; stroke-width: 2; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #0ea5e9; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#ffffff"/>
  <text x="60" y="58" class="title">Brainbaseのシステム構成</text>
  <text x="60" y="88" class="body">材料・正本・意味・判断・実行を分け、必要な時だけつなぐ</text>

  <rect x="50" y="150" width="185" height="250" rx="18" class="panel"/>
  <text x="142" y="188" text-anchor="middle" class="heading">情報源</text>
  <text x="76" y="230" class="body">メール</text>
  <text x="76" y="260" class="body">議事録・ドライブ</text>
  <text x="76" y="290" class="body">タスク・コード</text>
  <text x="76" y="320" class="body">実績・観測結果</text>
  <text x="76" y="365" class="small">判断の材料</text>

  <rect x="280" y="205" width="150" height="140" rx="18" class="human"/>
  <text x="355" y="247" text-anchor="middle" class="heading">確認・承認</text>
  <text x="355" y="280" text-anchor="middle" class="body">人間が正本へ</text>
  <text x="355" y="305" text-anchor="middle" class="body">昇格する</text>

  <rect x="475" y="125" width="260" height="300" rx="22" class="semantic"/>
  <text x="605" y="165" text-anchor="middle" class="heading">意味と事実の中核</text>
  <rect x="505" y="195" width="200" height="80" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="605" y="228" text-anchor="middle" class="heading">オントロジー</text>
  <text x="605" y="252" text-anchor="middle" class="small">型・関係・制約</text>
  <rect x="505" y="305" width="200" height="90" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="605" y="340" text-anchor="middle" class="heading">Graph SSOT</text>
  <text x="605" y="366" text-anchor="middle" class="small">確定した人物・組織・判断</text>

  <rect x="780" y="205" width="165" height="140" rx="18" class="judgment"/>
  <text x="862" y="247" text-anchor="middle" class="heading">Judgment DAG</text>
  <text x="862" y="280" text-anchor="middle" class="body">根拠・判断・権限</text>
  <text x="862" y="305" text-anchor="middle" class="body">実行・評価</text>

  <rect x="990" y="150" width="160" height="250" rx="18" class="human"/>
  <text x="1070" y="190" text-anchor="middle" class="heading">人間 + AI</text>
  <text x="1015" y="235" class="body">人間</text>
  <text x="1015" y="260" class="small">基準・承認・責任</text>
  <text x="1015" y="310" class="body">AI</text>
  <text x="1015" y="335" class="small">探索・反証・実行</text>

  <path d="M235 275 H280" class="arrow"/>
  <path d="M430 275 H475" class="arrow"/>
  <path d="M735 275 H780" class="arrow"/>
  <path d="M945 275 H990" class="arrow"/>

  <rect x="330" y="505" width="540" height="120" rx="20" class="result"/>
  <text x="600" y="548" text-anchor="middle" class="heading">実行・成果物・結果の証跡</text>
  <text x="600" y="580" text-anchor="middle" class="body">許可された操作だけを実行し、結果を評価可能な形で残す</text>
  <path d="M1070 400 V565 H870" class="arrow"/>
  <path d="M330 565 H142 V400" class="feedback"/>
  <text x="170" y="545" class="small">結果を次の判断材料へ戻す</text>
</svg>
