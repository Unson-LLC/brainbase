id: workflow.mission-control
name: Workflow Mission Control
lifecycle: retired
replacement:
  - automation.run-core
  - run-receipt.inbox
  - meeting.automation
purpose: Historical record of the retired generic Workflow Web product. Do not restore this surface or add new public Workflow CRUD contracts.
surfaces:
  ui: []
  api:
    - compatibility-only /api/workflows/control routes for Meeting Automation and org-agent control
    - Automation Run retry, detail, and human-step resolution remain under /api/workflow-runs
    - generic list, create, detail, update, draft, draft-test, and manual-run routes are retired and return 404
  code:
    - server/services/automation-runtime/automation-runtime-services.js
    - server/services/automation-runtime/agent-control-catalog-service.js
    - server/services/automation-runtime/loop-intent-service.js
    - server/services/workflow/workflow-runner.js
    - server/services/workflow/workflow-repository.js
    - server/routes/workflows.js
  data:
    - var/workflow-ledger.json
    - workflows
    - workflow_runs
    - workflow_context_sources
    - workflow_human_steps
    - workflow_outputs
    - workflow_audit_logs
depends_on:
  - automation.run-core
  - run-receipt.inbox
  - meeting.automation
visibility_rules:
  - /workflows and /workflows.html return 404.
  - The Brainbase activity bar has no Workflow entry or overlay.
  - Generic Workflow create, update, draft, test, publish, and manual-run are not exposed through MCP.
  - Generic Workflow list, create, detail, update, draft, and draft-test HTTP APIs are removed.
  - Existing workflow-prefixed API and ledger names are compatibility details, not a product commitment.
  - Human approval, Run Receipt, and Meeting diagnosis use domain-specific MCP tools and preserve project scope and audit evidence.
verification:
  commands:
    - npm run test:run -- tests/server/bootstrap/static-routes.test.js tests/server/routes/run-receipt-routes.test.js tests/server/routes/companion-approval-inbox.test.js
    - cd mcp/brainbase && npm test
    - cd mcp/brainbase && npm run build
  expected:
    - /workflows and /workflows.html return 404 and no production Web link remains.
    - Meeting Automation, Automation Run, Human Approval, Audit, and Run Receipt contracts pass without a Web UI.
    - MCP exposes no generic Workflow CRUD or manual-run tool.
    - Generic Workflow HTTP read/edit/draft requests return 404 while Control and Automation Run contracts remain green.
common_failures:
  - A compatibility API or ledger name is mistaken for permission to restore the Workflow product.
  - A retired UI E2E is reintroduced instead of testing the API, MCP, or Companion replacement.
  - A blocked or unavailable source is flattened into an empty success result.
runbooks:
  - ../runbooks/run-receipt-inbox-v1.md
troubleshooting: []
