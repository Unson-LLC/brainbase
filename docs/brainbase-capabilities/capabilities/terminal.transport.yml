id: terminal.transport
name: Terminal xterm transport
purpose: Provide interactive terminal IO for Claude Code and Codex sessions through xterm.
surfaces:
  ui:
    - xterm terminal pane
  api:
    - terminal websocket endpoints
    - terminal transport HTTP helpers
  code:
    - public/modules/core/terminal-transport-client.js
    - scripts/codex-pty-shim.py
    - server/services/session-runtime
  data:
    - session runtime state
    - terminal snapshots
depends_on:
  - runtime.launchd
visibility_rules:
  - Enter should provide immediate local feedback even when readiness probes lag.
  - Table rendering snapshots must not be cleared by volatile prompt transitions.
  - Focus loss can look like input transport failure.
  - Pending or failed startup shells must keep the startup composer visible and reject terminal IO until the runtime is ready.
  - Outer terminal capability/color/focus responses must be consumed by the PTY shim and must not reach Codex stdin.
  - Terminal writes must coalesce xterm renderer refreshes so bottom-row redraws do not leave stale duplicate cells.
  - Backspace/Delete must provide immediate local visual feedback even after prior input echo has already been confirmed.
  - Escape/navigation keys must bypass text batching and flush any pending printable text first.
  - Split focus reports must hold a lone ESC briefly so a following bare `[I` or `[O` can be dropped as one control response.
  - Multiline paste must use a single bracketed paste transport instead of per-line `S-Enter` key simulation.
verification:
  commands:
    - npm test -- tests/unit/terminal-transport-client.test.js
    - npm test -- tests/unit/codex-pty-shim.test.js
    - inspect /api/version to confirm canonical runtime sha
  expected:
    - Pure Enter input takes the fast path.
    - Table snapshots remain stable across prompt/polling transitions.
    - Pending startup shells return 409 for terminal HTTP helpers and close websocket transport with code 4009.
    - Xterm focus reports (`ESC[I`, `ESC[O`) and bare focus fragments (`[I`, `[O`) are not echoed or sent as terminal input.
    - Terminal responses such as `ESC[?0u`, `ESC[0u`, `ESC[I`, `ESC[O`, and OSC 10/11 color responses are dropped before Codex can treat ESC as interrupt.
    - Codex PTY shim drops bare focus fragments (`[I`, `[O`) even when the leading ESC was already consumed upstream.
    - Streaming writes refresh the lower visible rows after write callbacks, and reset snapshots refresh all visible rows.
    - Backspace locally erases one ASCII cell immediately and consumes the matching simple PTY echo to avoid double deletion.
    - Esc key presses are sent immediately one-by-one and are not delayed by the text batch timer.
    - Split focus reports (`ESC` then `[I`/`[O`) are dropped before either fragment reaches local echo or stdin.
    - Multiline paste is sent as one `paste` input and reaches tmux through `paste-buffer -p -r`.
common_failures:
  - Enter appears delayed because xterm is not repainted even though the backend received input.
  - Snapshot preservation regresses after develop sync if the fix is not merged.
  - Focus reporting bytes or focus loss disrupt input order.
  - Terminal response bytes leak into Codex input, causing visible fragments like `[0` or `]10;rgb...` and unsolicited "Conversation interrupted" states.
  - Xterm renderer keeps stale lower-row cells after rapid prompt/status redraws, making the bottom of the terminal look duplicated.
  - Backspace feels delayed because it waits for Codex/Claude PTY output once pending local echo has already been confirmed.
  - Esc feels delayed because it is recognized as navigation for probe bypass but still waits in the printable text batch buffer.
  - `[I` or `[O` appears when `ESC[I`/`ESC[O` is split across xterm `onData` events and the leading ESC is sent before the bare suffix arrives.
  - Long multiline paste is slow when each line is sent as text and each newline is converted into an awaited `S-Enter` key message.
  - A startup shell is mistaken for a ready terminal session, causing blank xterm panes or queued input to hit a missing runtime.
runbooks:
  - ../runbooks/verify-31013-source.md
troubleshooting:
  - ../troubleshooting/launchd-overwrites-local-changes.md
