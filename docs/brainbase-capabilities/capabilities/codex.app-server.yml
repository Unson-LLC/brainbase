id: codex.app-server
name: Codex App Server adapter
purpose: Provide a structured JSON-RPC integration path for Codex threads, turns, and notifications without relying on terminal snapshots.
surfaces:
  ui:
    - session display-route state for Codex App Server thread sessions
  api:
    - /api/sessions/report_activity
    - /api/state/sessions/:sessionId
  code:
    - server/services/codex-app-server-adapter.js
    - server/services/codex-app-server-activity-bridge.js
    - server/services/codex-app-server-session-state.js
    - server/services/session-runtime/runtime-query-methods.js
    - scripts/codex-app-repl.mjs
    - scripts/lib/codex-app-server-activity-client.mjs
    - public/modules/domain/session/session-display-route.js
    - public/modules/session-ui-state.js
    - docs/stories/story-codex-appserver-thread-session-foundation.md
    - docs/stories/story-codex-appserver-session-state-ssot.md
    - docs/stories/story-codex-appserver-repl-activity-bridge.md
    - docs/architecture/codex-appserver-session-state-ssot-architecture.md
    - docs/architecture/codex-appserver-thread-session-foundation-architecture.md
    - docs/architecture/codex-appserver-repl-activity-bridge-architecture.md
    - docs/specs/codex-appserver-session-state-ssot-spec.md
    - docs/specs/codex-appserver-thread-session-foundation-spec.md
    - docs/specs/codex-appserver-repl-activity-bridge-spec.md
    - tests/server/services/codex-app-server-adapter.test.js
    - tests/server/services/codex-app-server-activity-bridge.test.js
    - tests/server/services/codex-app-server-session-state.test.js
    - tests/unit/codex-app-server-activity-client.test.js
    - tests/domain/session/session-display-route.test.js
    - tests/unit/session-ui-state.test.js
    - tests/e2e/story-codex-appserver-thread-session-foundation-contract.spec.ts
    - tests/e2e/story-codex-appserver-session-state-ssot-contract.spec.ts
    - tests/e2e/story-codex-appserver-repl-activity-bridge-contract.spec.ts
  data:
    - in-memory Codex App Server process state
    - in-memory JSON-RPC pending request map
    - existing session hookStatus activity state when an adapter is wired through the activity bridge
    - session.codexAppServer durable metadata for Codex-only App Server thread, turn, and restore identity
depends_on:
  - session.create
  - terminal.transport
visibility_rules:
  - This first slice is a backend adapter only; it must not replace xterm/tmux terminal transport.
  - Use stdio transport first; WebSocket transport is experimental and out of scope for this capability slice.
  - Initialize with Brainbase client metadata before sending thread or turn requests.
  - Emit app-server notifications as structured events instead of parsing terminal text.
  - App Server turn notifications may feed the existing activity indicator path only through the activity bridge and `activityService.reportActivity`.
  - The terminal REPL path must send the same structured lifecycle metadata to `/api/sessions/report_activity` and persist `session.codexAppServer` through the state API.
  - App Server-backed indicator updates must use Brainbase session ids from explicit metadata or bridge context; terminal text must not be used to infer ownership.
  - Persist only the App Server thread, active turn, lifecycle, and restore metadata defined by `story-codex-appserver-session-state-ssot`.
  - Codex App Server display eligibility is derived only for Codex sessions with non-stale App Server thread metadata.
  - Codex sessions without App Server thread metadata and all Claude Code sessions remain on the xterm display route.
  - Stale App Server metadata must remain distinguishable from missing metadata in display-route reasons.
  - App Server display-route state is read-only until a separate transcript-rendering story owns the browser panel and input path.
  - Keep full App Server event item persistence out of scope unless a separate ledger story defines ownership and retention.
  - App Server session-state metadata is a Codex-only boundary; Claude Code sessions must not store or consume it.
verification:
  commands:
    - npm test -- tests/server/services/codex-app-server-adapter.test.js
    - npm run test:run -- tests/server/services/codex-app-server-activity-bridge.test.js
    - npm run test:run -- tests/server/services/codex-app-server-session-state.test.js tests/server/session-runtime-inventory.test.js
    - npm run test:run -- tests/unit/codex-app-server-activity-client.test.js
    - npm run test:run -- tests/domain/session/session-display-route.test.js tests/unit/session-ui-state.test.js
    - npm run test:e2e -- tests/e2e/story-codex-appserver-thread-session-foundation-contract.spec.ts
    - BRAINBASE_E2E_PORT=31018 npm run test:e2e -- tests/e2e/story-codex-appserver-session-state-ssot-contract.spec.ts
    - BRAINBASE_E2E_PORT=31018 npm run test:e2e -- tests/e2e/story-codex-appserver-repl-activity-bridge-contract.spec.ts
    - npx -y @openai/codex@latest app-server --help
  expected:
    - Adapter unit tests pass.
    - Activity bridge tests prove `turn/started` maps to working and `turn/completed` maps to done-unread through existing hookStatus.
    - Session-state tests prove Codex-only App Server metadata persistence, restore selection, explicit missing-metadata fallback, and Claude Code non-mutation.
    - REPL activity client tests prove the REPL path constructs structured lifecycle metadata and session-state patches; port 31013 live-runtime proof still requires post-merge smoke evidence.
    - Display route tests prove Codex App Server metadata selects the App Server route and Claude Code stays on xterm.
    - Display-route contract E2E covers the Story acceptance criteria through Story/ADR/Spec/code/test anchors.
    - Codex CLI exposes the app-server command. If the local global `codex` shim is broken, use `npx -y @openai/codex@latest` as the reproducible CLI entrypoint for this capability check.
    - Existing terminal transport remains unchanged for user-facing sessions.
common_failures:
  - Sending thread or turn requests before initialize/initialized handshake completes.
  - Treating malformed stdout as fatal instead of emitting parse_error.
  - Wiring App Server notifications directly to browser state instead of the existing activity service.
  - Reporting REPL App Server turns as legacy unscoped working/done payloads, which can leave active turn state uncleared.
  - Accepting App Server notifications without an explicit Brainbase session id.
  - Exposing WebSocket app-server transport remotely without auth.
  - Persisting app-server events into Graph SSOT directly instead of a defined session/event ledger.
  - Reading session.codexAppServer metadata for Claude Code sessions.
  - Treating Codex App Server display-route eligibility as permission to remove xterm fallback.
runbooks: []
troubleshooting: []
