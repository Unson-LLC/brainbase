id: judgment.resolve
name: Host judgment episode lifecycle
purpose: Open one unresolved context-bound judgment episode at UserPromptSubmit, require the Codex model to resolve it through Brainbase before answering, record actual Brainbase calls, and finalize one auditable episode receipt at its contract-defined lifecycle boundary without authorizing the eventual action.
surfaces:
  ui:
    - Codex in-progress systemMessage when Stop rejects an unnecessary user question
    - Completing lifecycle-event systemMessage containing the journal-derived owner audit and optional judgment value-proof surfaces
    - Final autonomy-continuation and Stop-repair lines only when the immutable continuation journal proves completion
  mcp: [brainbase_resolve_turn]
  host:
    - UserPromptSubmit -> POST http://127.0.0.1:39002/host/judgment/resolve
    - PostToolUse -> append-only Brainbase tool event
    - Stop -> bounded Codex App delegation recovery when needed, then normal atomic final episode receipt
    - final completed state PostToolUse -> atomic final receipt for a previously rejected runtime 2.4 continuation
  api:
    - POST /api/judgment/resolve
  code:
    - scripts/codex-hooks/judgment-resolver-entry.sh
    - scripts/codex-hooks/judgment-resolver-host.mjs
    - scripts/check-codex-judgment-hook-readiness.mjs
    - scripts/launchd/brainbase-runtime-target.sh
    - scripts/launchd/brainbase-ui-start.sh
    - scripts/launchd/brainbase-runtime-update.sh
    - mcp/brainbase/src/server.ts
    - mcp/brainbase/src/tools/judgment-resolution-tools.ts
    - mcp/brainbase/src/tools/judgment-host-contract.ts
    - server/services/judgment-resolution-service.js
    - server/routes/judgment-resolution.js
  data:
    - config/judgment-runtime-manifest.json
    - config/judgment-runtime-manifest-lock.json
    - User-local episode, event, continuation, and final journals; raw session IDs, absolute paths, secrets, raw tool payloads, and unbounded conversation text are not persisted.
depends_on:
  - auth.grants
  - graph.ssot
  - knowledge.resolve
visibility_rules:
  - A normal Codex turn opens one unresolved judgment episode at UserPromptSubmit because answering is also a judgment. The model then calls `brainbase_resolve_turn` with its semantic interpretation before other work.
  - If Codex App delegation omitted UserPromptSubmit, the first Stop may recover exactly one current-turn complete `codex_delegation` from `create_thread` or `send_message_to_thread` only when the transcript contains one connected current-session alias component. Foreign session components, multiple candidates, malformed envelopes, and other tools fail closed. The recovered episode records `episode_origin=stop_delegation_recovery` and `route_application=post_generation_recovery`; its route governs Stop and later continuation, never the already-generated initial answer.
  - The Host constructs canonical conversation_context from ordered raw conversation messages, prior finalized episodes, runtime/project data, and instruction digests.
  - The model calls Judgment Resolver through the model-visible `brainbase_resolve_turn` MCP tool. It submits a semantic interpretation plus `turn_ref`; the server reads canonical turn input from the journal, so raw turn input and its absolute path are not carried through model context.
  - Judgment Resolver has no second internal LLM. The current Codex model supplies semantic classification; deterministic manifest-owned semantic_matchers, bounded prior-context inheritance, safety floors, and policies may only strengthen that interpretation before selecting the initial route.
  - The model interpretation owns semantic classification. Deterministic keyword matches may only add obligations, action floors, risks, domains, or signals; an unmatched rule never removes a capability or implies `general/answer`.
  - UserPromptSubmit opens exactly one unresolved episode and stores canonical turn input; it does not classify semantics or decide whether Brainbase is required.
  - The model calls `brainbase_resolve_turn` exactly once with `turn_ref` and its semantic interpretation. The server reads the unchanged canonical turn input from the Host journal and Brainbase returns the immutable TurnContract; hard keyword matchers may add obligations and risk but may never remove model-inferred requirements.
  - Stop requires successful current-turn `resolve_turn` evidence before it compares TurnContract capabilities with PostToolUse evidence.
  - The Resolver deterministically fixes autonomy_decision as continue or escalate in the initial receipt. Escalation is never derived from classification (risk/action_kind) alone: it fires only for needs_classification, needs_policy_resolution, or an applicable policy whose human_approval rule (action_kinds/risks) matches the classification, and the receipt carries the matched policy ids as autonomy_policy_ids. Only genuinely high-stakes policies (production deploy, external send to a third party, shared-data delete, a charge) declare human_approval; routine git push/merge/CI/restart/local write/company Slack post never escalate on their own. Stop verifies answer compliance without asking another model to re-grade the task; the legacy Stop-time model evaluator is used only for already-open legacy receipts during rollout.
  - Continue completes low/medium-risk in-scope work without preference or just-in-case questions. It may escalate at runtime only for irreversible action, missing authority, an owner-only value choice, unavailable required input, or an evidenced terminal blocker. Escalate requires one exact reason-marked confirmation and never authorizes the action. A human only has to answer an escalation once per session: once the prior turn ends waiting_human, the Host records that approval in a session-scoped append-only `approvals.json`, and any later turn whose autonomy_policy_ids (or reason_code, when policy-less) are already approved continues automatically instead of asking again; the finalized episode records which approval it used as approval_ref.
  - The current Codex model is the open-ended LLM in the execution loop. It decides how to answer inside the selected DAG and may formulate, refine, and call Brainbase knowledge/retrieval tools 0..N times as results create new questions; there is no one-call-per-turn limit.
  - Claude Code is a future Host-adapter candidate for the same responsibility split, but is not part of the current episode-lifecycle hook integration.
  - Knowledge Resolver deterministically chooses a canonical source route and required retrieval capability; it does not search or retrieve content.
  - PostToolUse records only actual `mcp__brainbase__*` outcomes and emits a short owner-visible line that accurately distinguishes reference routing, searching, retrieval, and writes.
  - Only successful exact `mcp__brainbase__brainbase_knowledge_resolve` calls satisfy a required `knowledge.resolve`; unrelated or failed calls do not.
  - Same-turn episode start, PostToolUse commits, and lifecycle finalization share a per-turn SQLite immediate transaction; concurrent calls receive a unique event sequence in journal-commit order, and process exit releases the lock without stale-path deletion.
  - Episode creation stores the exact Stop audit contract and lifecycle marker. A runtime deployment during an active turn cannot add a new owner-visible line or repair policy to that already-open episode.
  - >-
    Stop validates required capabilities, autonomy, continuation, and business-body evidence, binds the exact Stop Hook-visible model answer, then finalizes one complete episode receipt and returns the complete journal-derived owner audit/value surface as one `systemMessage`; the model does not reproduce those lines. `final.json` records `owner_audit_source=stop_hook_system_message`; `answer_digest` binds the exact raw model-authored `last_assistant_message`, not the Host `systemMessage`. Transcript comparison may exclude only one complete trailing `<oai-mem-citation>...</oai-mem-citation>` block added later by the Codex application; an incomplete, embedded, or multiple citation block remains part of comparison and fails closed on mismatch. When a continue receipt rejects an unnecessary user question, the first Stop emits the short Host-generated `🔁` in-progress systemMessage and stores count, trigger, reason, and requested status in the immutable continuation journal. After the safe work completes, the Host renders the episode-bound `🔁 自律継続` line and any journal-proven `🛠️ Stop修復` line in the completed Stop `systemMessage`. Every repairable Stop rejection records one Host-owned `stop_repair` marker. A model-authored `🛠️` line without that marker is rejected; any unjournaled `🔁` copy is also rejected. A missing required route, autonomy, continuation, or business-body condition returns `decision:block` on the first repairable Stop and writes no final receipt. Stop blocks at most once per episode: if a continuation marker already exists and the active repeated Stop (stop_hook_active=true) is still incomplete, it converges to a finalized `audit_degraded` receipt (`degradation_reason` names the first missing capability, `missing_capabilities` lists them all) and appends `⚠️ 監査縮退: <reason>` to the Host `systemMessage`. audit_degraded finals are never enqueued to the knowledge outbox (only `completion_status: complete` is). A true orphan Stop requests one warning-preserving repair, then exits 0 with a non-final `audit_degraded` receipt; that immutable barrier rejects a late Start for the same identity. Missing identity, diagnostic or degraded integrity conflict, and transaction-acquisition timeout remain terminal fail-closed errors. When knowledge is optional and zero Brainbase calls were recorded, the Host audit block explicitly reports zero calls. Audit-only repair stores only the normalized non-audit body digest and character count, then rejects a retry if the business body was deleted, summarized, or replaced.
  - 差し戻し済みruntime 2.4 continuationでは、最後の正常なstate PostToolUseが将来のStop有無に依存しない正規の確定境界となり、`owner_audit_source=post_tool_use_system_message`と`answer_digest=null`を記録する。後続Stopは同じimmutable finalをreplayする。差し戻しのない通常経路をStopで確定した場合は`owner_audit_source=stop_hook_system_message`となる。
  - For implement/operate requests, Stop also rejects a final answer that only describes a pending remediation target or future fix without completion or no-change evidence. It stores trigger `unfinished_safe_work`, uses the owner-visible `🔁 未完了` progress line, and requires the episode-bound `🔁 実行継続` completion line. This completion contract does not claim semantic content verification.
  - Static Hook definitions are only installed state. Codex Host hooks/list must report all three current bindings as trusted and matcher-correct before the checker returns ready_for_fresh_task. Modified or untrusted definitions are trust_required; the owner approves them through /hooks, and only a task created afterwards can provide proven_active live evidence. Repository code never writes trusted_hash.
  - Each active node has a manifest-owned executable definition; only selected branches run.
  - A managed clarification receipt continues to model generation and selects the clarification DAG.
  - Project binding is judgment context, not action authority; project policies remain access-scoped without blocking general judgment.
  - A receipt does not authorize write or external action; normal platform permissions and executor authorization remain independent.
  - Missing bridge, rejected binding, invalid context, mismatched receipt, or unavailable service blocks model generation visibly.
verification:
  commands:
    - npm run check:judgment-hook-readiness -- --cwd "$BRAINBASE_CANONICAL_ROOT"
    - npm run test:judgment-resolution
    - npm --prefix mcp/brainbase run typecheck
    - npm run typecheck
    - cmp -s CLAUDE.md AGENTS.md
  expected:
    - Resolver is available to the model as `brainbase_resolve_turn`; the preferred request carries `turn_ref` and a semantic interpretation, never raw journal paths.
    - Resolver classification combines the current Codex model interpretation with monotonic manifest-backed safety floors and has no separate LLM provider or model API dependency.
    - Host preserves exact ordered user/assistant text and removes host envelopes and tool internals structurally.
    - The same turn reuses its initial route without another Resolver request.
    - A normal start and recovered start are distinguishable in both episode and final receipts; a recovered route cannot be represented as pre-generation.
    - A mixed-session transcript cannot provide a recovery candidate even when a foreign delegation reuses the current turn ID.
    - Multiple distinct Brainbase calls create multiple immutable events; replay creates no duplicate.
    - The completing Stop or final state PostToolUse `systemMessage` contains the stored owner judgment and tool-event lines exactly once in journal-commit order, followed by optional value-proof surfaces. `final.json` records the matching source as `stop_hook_system_message` or `post_tool_use_system_message`. Production acceptance reads the actual owner UI or event stream because transcript `response_item` formatting is not the Hook surface contract.
    - The Stop audit contract is bound at episode start, and an audit-only continuation cannot complete after shortening the original non-audit answer body.
    - Raw tool input/output and secret-like values are absent from journals and owner-visible lines.
    - Zero Brainbase calls is complete when no Brainbase capability is required.
    - A continue receipt rejects an unnecessary user decision request, accepts completion with an optional follow-up offer, and accepts only exact allowed runtime-escalation reasons. An escalate receipt requires the Resolver reason marker at the start of the answer body.
    - An unnecessary-question rejection emits exactly one short in-progress `systemMessage`; any final `🔁` audit line and count are rendered only from the immutable continuation journal. Normal turns emit neither line.
    - A completed Stop repair emits one final `🛠️` audit line only from the immutable `stop_repair` marker. A normal turn emits no repair line.
    - Required `knowledge.resolve` is complete only after a successful exact route call.
    - A replayed complete Stop reuses the same final receipt; an evidence-incomplete active repeated Stop for an existing episode (one block already happened) converges to a finalized `audit_degraded` receipt with exit 0 instead of blocking again or exiting non-zero, while a true orphan Stop converges to non-final `audit_degraded` with exit 0 and rejects a late Start for the same identity. Neither writes a fabricated `complete` final, and neither reaches the knowledge outbox.
    - Current Codex Hook trust is ready_for_fresh_task before live verification, and proven_active evidence comes from a task created after owner trust approval.
    - Local UI/MCP rollback uses the shared disposable runtime and a validated full-SHA pin that launchd start and periodic update both honor; missing roots, root mismatches, invalid pins, and unavailable commits fail closed without modifying the canonical checkout.
common_failures:
  - Asking the model to carry raw turn input or an absolute journal path instead of calling Resolver with `turn_ref` and its semantic interpretation.
  - Describing an internal "Resolver LLM" even though the current Resolver is deterministic and the Codex model owns open-ended investigation.
  - Treating the initial route receipt as proof that Brainbase knowledge was retrieved.
  - Counting any Brainbase tool call as satisfying `knowledge.resolve`.
  - Treating one network attempt or one tool call as the per-turn invariant.
  - Treating brainbase_project_not_accessible as a reason judgment cannot run.
  - Adding a second Judgment-specific action guard that re-judges the receipt.
  - Calling an LLM at Stop to decide again whether routine work should continue after a new Resolver receipt already fixed autonomy_decision.
runbooks:
  - ../runbooks/judgment-resolve.md
troubleshooting: []
