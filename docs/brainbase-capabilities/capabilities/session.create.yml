id: session.create
name: Session creation
lifecycle: retired
purpose: Historical record of the retired Brainbase server-side session creation API. Codex app/CLI now owns task and worktree creation; the residual browser picker safety contract belongs to project.selector.
surfaces:
  api:
    - POST /api/sessions
  code:
    - server/controllers/session-controller.js
    - server/controllers/session/codex-app-server-startup.js
    - server/services/worktree-service.js
visibility_rules:
  - Do not restore this capability. ADR-019 assigns task and worktree lifecycle to Codex app/CLI.
  - Retired Brainbase-owned session creation and static app endpoints return 410 Gone.
  - Residual browser picker UI is not owned by this retired capability; its temporary safety contract is project.selector.
verification:
  commands:
    - npm run test:e2e -- tests/e2e/story-inline-session-creation-pr-gate.spec.ts
  expected:
    - session.create does not claim ownership of the residual browser picker.
    - project.selector owns the residual browser picker compatibility contract.
common_failures:
  - A compatibility route accidentally restores Brainbase-owned task or worktree creation.
