id: development.workflow
name: Brainbase development workflow
purpose: Keep Brainbase implementation work reviewable and recoverable with focused Git branches, explicit staging, and PR review.
surfaces:
  ui:
    - Agent coding sessions
    - Worktree-backed sessions
  api: []
  code:
    - .codex/hooks.json
    - scripts/codex-hooks-reminder.sh
    - .claude/rules/commit-strategy.md
    - .claude/skills/git-commit-rules/SKILL.md
  data:
    - Git branch and commit history
    - Git worktree checkout
depends_on: []
visibility_rules:
  - Project Provisioning uses Skill/CLI/API/MCP; the retired browser Session Launch Picker is not the project-registration workflow.
  - Git status and diff are the authoritative local work state for Brainbase worktrees.
  - Start coding tasks with `git status --short --branch`, `git diff --name-status`, and `git diff --stat`.
  - Stage only files owned by the current intent; never use `git add -A` in a mixed worktree.
  - One focused intent becomes one commit and one reviewable PR.
verification:
  commands:
    - git status --short --branch
    - git diff --name-status
    - git diff --cached --name-status
    - git diff --check
  expected:
    - The intended change has a focused Git commit.
    - No unrelated changes are mixed into the intended change.
    - Remaining working-copy changes are explicitly classified before merge or handoff.
common_failures:
  - Codex sessions missing the UserPromptSubmit reminder and starting Brainbase work without opening the relevant capability.
  - Using `git add -A` and mixing unrelated user work into the commit.
  - Calling a local commit "merged" before the PR/develop integration has happened.
runbooks: []
troubleshooting: []
