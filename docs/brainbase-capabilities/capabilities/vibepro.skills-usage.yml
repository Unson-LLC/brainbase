id: vibepro.skills-usage
name: VibePro Skills usage in Brainbase
purpose: Keep one accepted Brainbase-managed implementation connected from Story to Spec, implementation, affected tests, one review wave, and the repository's normal GitHub flow.
surfaces:
  ui:
    - Agent responses for VibePro-assisted implementation and review
  api:
    - Optional VibePro CLI story, graph, diagnose, and PR preparation commands
  code:
    - .claude/skills/vibepro-workflow/SKILL.md
    - .claude/skills/vibepro-story-refactor/SKILL.md
    - .claude/skills/vibepro-human-review/SKILL.md
    - CLAUDE.md
    - AGENTS.md
depends_on:
  - vibepro.impact-review
  - development.workflow
  - verification.testing
  - graph.ssot
visibility_rules:
  - Load vibepro-workflow for Brainbase-managed implement judgments.
  - Use story-refactor or human-review only when the requested work needs that bounded activity.
  - Architecture and Graphify are conditional, not mandatory ceremonies.
  - Use the repository's normal GitHub PR, review, CI, and merge authority.
  - Do not require generated review artifacts, Gate state, score, or tool-usage evidence.
verification:
  commands:
    - Run the affected tests for the accepted behavior.
  expected:
    - The Story outcome and Spec invariants are satisfied.
    - Affected tests pass and the normal repository PR flow is used.
common_failures:
  - Running VibePro for diagnose, answer, or pure operate work.
  - Collecting optional artifacts after code and affected tests already establish the result.
  - Treating VibePro output as approval, merge, deployment, or organization authority.
runbooks:
  - ../runbooks/vibepro-skills-usage.md
troubleshooting:
  - ../troubleshooting/vibepro-skipped-before-fix.md
