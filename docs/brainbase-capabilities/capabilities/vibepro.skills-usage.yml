id: vibepro.skills-usage
name: VibePro Skills usage in Brainbase
purpose: Define how Brainbase agents should use VibePro Skills when the user asks for VibePro-driven refactoring, review, Graphify impact checks, or human-review cockpit work.
surfaces:
  ui:
    - Agent responses for VibePro work
    - Human review artifacts generated by VibePro
  api:
    - VibePro CLI skills commands
    - VibePro CLI story, task, pr, graph, and codex commands
  code:
    - .claude/skills/vibepro-workflow/SKILL.md
    - .claude/skills/vibepro-story-refactor/SKILL.md
    - .claude/skills/vibepro-human-review/SKILL.md
    - CLAUDE.md
    - AGENTS.md
  data:
    - .vibepro/
    - .vibepro/pr/<story-id>/review-cockpit.html
    - .vibepro/pr/<story-id>/human-review.json
depends_on:
  - vibepro.impact-review
  - development.workflow
  - verification.testing
  - graph.ssot
visibility_rules:
  - When the user mentions VibePro, first load `.claude/skills/vibepro-workflow/SKILL.md`.
  - For story-driven refactoring, latent bugs, security risks, DRY issues, or responsibility separation, also load `.claude/skills/vibepro-story-refactor/SKILL.md`.
  - For human review, review cockpit, HTML artifacts, or approve/block/waive decisions, also load `.claude/skills/vibepro-human-review/SKILL.md`.
  - Install VibePro Skills into the repo where the agent is operating from. For Brainbase sessions, that means `/Users/ksato/workspace/code/brainbase`, not only the target repository such as Aitle.
  - Target-repository VibePro Skills are optional and only needed when agents will operate from that target repo directly.
  - Codex still needs the VibePro managed block in `AGENTS.md`; in Brainbase, keep that block aligned with the `CLAUDE.md` source of truth.
verification:
  commands:
    - vibepro skills verify /Users/ksato/workspace/code/brainbase
    - vibepro codex verify /Users/ksato/workspace/code/brainbase
  expected:
    - `vibepro-human-review`, `vibepro-story-refactor`, and `vibepro-workflow` report `ok`.
    - `vibepro codex verify` reports `overall_status: ok`.
    - A VibePro task response can cite which VibePro Skill was used for workflow, refactoring, or human review.
common_failures:
  - Installing VibePro Skills only into a target repository, so Brainbase agents never load them.
  - Loading only `vibepro-workflow` for a refactor that also needs `vibepro-story-refactor`.
  - Reviewing Markdown artifacts when the relevant VibePro Skill points to `review-cockpit.html`.
  - Treating `SKILL.md` as sufficient for Codex even though Codex reads `AGENTS.md` instructions.
runbooks:
  - ../runbooks/vibepro-skills-usage.md
troubleshooting:
  - ../troubleshooting/vibepro-skipped-before-fix.md
