id: project.selector
name: Session compatibility project selector
purpose: Describe the residual browser Session Launch Picker and Workspace Setup consumers; this is not a formal Project Catalog or Project Provisioning entry.
surfaces:
  ui:
    - "#session-launch-project-select (residual Session Launch Picker)"
    - "#session-launch-picker (residual session-creation route)"
    - "#session-project-select (Workspace Setup)"
  compatibility_consumer:
    - "#session-launch-project-select (residual Session Launch Picker)"
    - "#session-launch-picker (residual session-creation route)"
    - "#session-project-select (Workspace Setup)"
  api:
    - GET /api/config/projects (authenticated runtime Project Catalog)
    - GET /api/config (Workspace Setup local topology only)
  code:
    - public/modules/app/ui-setup-mixin.js
    - public/modules/app/session-creation-mixin.js
    - public/modules/project-mapping.js
  data:
    - runtime project catalog source/status
    - config.projects.projects
    - auth.access.projectCodes
    - auth_grants.project_codes
depends_on:
  - project.catalog
  - auth.grants
visibility_rules:
  - "The server-side `session.create`/static endpoint is retired; the browser Session Launch Picker is a residual downstream compatibility consumer until retirement completes, not a formal entry."
  - "Fetch project candidates from the authenticated runtime Catalog (`GET /api/config/projects`); `/api/config` is local Workspace Setup data and never an access/catalog fallback."
  - Add general as the first option.
  - Exclude archived projects.
  - Exclude projects with session_select:false.
  - "If auth.access.projectCodes is empty, treat access as unrestricted within the authenticated catalog."
  - "If projectCodes is non-empty, match only exact normalized project ID, explicit alias, or GitHub repository name; do not infer hyphenless IDs, parent IDs, or prefixes."
  - "A candidate is selectable only when explicit `local.path` is configured for the current Workspace; otherwise show a disabled Workspace Setup required option and never guess a path."
  - "Authentication, transport, Registry, or source.status unavailable failure is fail-closed: show status/error and retain only general; never re-add requested project outside returned candidates."
  - Workspace Setup and Connected-world Onboarding are separate capabilities.
verification:
  commands:
    - node scripts/manual-check-session-selector.mjs zeims
    - npm run test:run -- tests/ui/session-creation-mixin.test.js tests/ui/project-mapping-runtime-catalog.test.js tests/ui/ui-setup-mixin.test.js tests/unit/project-mapping.test.js
  expected:
    - "runtime Catalog loaded candidates are the only selectable source"
    - "exact ID, explicit alias, and GitHub repository grants are accepted; short prefix grants are rejected"
    - "projects without explicit local.path are shown as disabled Workspace Setup required options and have no guessed path"
    - "401, non-401, fetch exception, and source unavailable failures leave only general and expose an unavailable/error status"
    - "a requested project outside runtime candidates is not re-added and falls back to general"
common_failures:
  - grant updates are correct but the browser still has stale JWT/localStorage access.
  - The legacy /api/config topology is accidentally used as the runtime Catalog or access fallback.
  - A project without explicit local.path is given a guessed path.
  - A short project grant is treated as a prefix and expands access.
  - Browser module cache still holds an older project-mapping.js.
runbooks:
  - ../runbooks/missing-project-in-session-selector.md
  - ../runbooks/update-auth-grant-project-codes.md
troubleshooting:
  - ../troubleshooting/project-exists-but-selector-hides-it.md
  - ../troubleshooting/jwt-localstorage-access-stale.md
