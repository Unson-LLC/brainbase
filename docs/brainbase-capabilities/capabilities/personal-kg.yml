id: personal-kg
name: Personal KG (個人ナレッジグラフ)
purpose: |
  本人の判断基準、好み、制約、訂正、再利用可能な学びを、将来の判断に使える
  owner-visibleな認知記憶として保持する。Personal KGはGraph SSOTから分離し、
  チーム、組織、公開面への暗黙の投影責務を持たない。
surfaces:
  ui:
    - /oyasumi が日次の振り返り候補を提案する
    - /retro が候補の状態変化と昇格判断を確認する
  mcp:
    - search_personal_kg
  api:
    - GET /api/learning/memory-candidates/search
  code:
    - .claude/commands/oyasumi.md
    - .claude/commands/retro.md
    - server/services/learning-service.js
    - server/services/candidate-store/candidate-repository.js
    - server/sql/candidate-store-schema.sql
  data:
    - memory_candidates
    - personal_kg_entity_links
depends_on:
  - auth.grants
visibility_rules:
  - Personal KG coreはowner-visibleに限定する。
  - 候補ごとにprovenance、sensitivity、visibility、review state、適用範囲を保持する。
  - 私生活、医療、家族、取引先機密などの機微情報はowner-onlyとし、安全な抽象化が未確定ならレビューを必須にする。
  - Personal KG本文をGraph SSOTへコピーしない。別途レビューした組織事実、関係、RACI、正式な決定だけを昇格対象にする。
  - 別のcapabilityと明示承認なしに、チーム文書、公開文書、他プロダクト面へ投影しない。
  - 検索0件が証明するのは、完了した検索で一致がなかったことだけ。認証失敗、未接続、timeout、部分取得は未確認のままにする。
  - SNS名を含む既存コードや項目は互換性のため残し得るが、/oyasumi、/ohayo、/retroはその投影経路を呼び出さず表示もしない。
  - Graph SSOTはPersonal KG coreの必須依存ではない。昇格レビューまたはentity linkが必要な時だけ/retroから任意に照合する。
verification:
  commands:
    - npm run test:run -- tests/server/services/admin-visualization-service.test.js
    - npm run test:e2e -- tests/e2e/story-personal-kg-review-projection-cli.spec.ts --reporter=line
  expected:
    - ownerが対象候補を検索でき、provenanceとreview stateが維持される。
    - owner-onlyとneeds-reviewの内容がGraphや他の投影面から分離される。
    - 3ルーティンの契約がSNS生成または投影を要求しない。
common_failures:
  - 個人記憶を組織事実としてGraph SSOTへ書き込む。
  - 機微な候補を、抽出に成功しただけで承認済みとして扱う。
  - 未接続またはtimeoutした候補ソースを0件として報告する。
  - 旧projection-ready項目を現行ルーティンの責務と誤認する。
runbooks:
  - ../../../.claude/commands/oyasumi.md
  - ../../../.claude/commands/retro.md
troubleshooting: []
status_note: |
  現行candidate storeにはSNS向けの旧経路が残る。互換実装としてのみ保持し、
  日次ルーティンの契約からは除外する。
