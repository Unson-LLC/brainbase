id: graph.ssot
name: Brainbase Graph source of truth
purpose: Resolve canonical people, organizations, customers, partners, projects, apps, terms, decisions, stories, and philosophy context before writing facts or changing Graph-related data.
surfaces:
  ui:
    - Graph and info surfaces on bb.unson.jp
    - Agent answers that mention canonical names, customers, projects, or terms
  api:
    - GET https://bb.unson.jp/api/info/graph/entities
    - GET https://bb.unson.jp/api/info/context
    - brainbase MCP get_context
    - brainbase MCP list_entities
    - brainbase MCP get_entity
    - brainbase MCP search
  code:
    - .claude/scripts/hooks/user-prompt-submit/graph-ssot-reminder.ts
    - .claude/skills/brainbase-graph-philosophy-context/SKILL.md
    - .claude/skills/brainbase-mcp-apiの検索結果はクエリ条件を信用せずレスポンス本体で再検証する/SKILL.md
  data:
    - ~/.brainbase/tokens.json
    - Brainbase Graph entity records
    - Brainbase Philosophy Context
depends_on:
  - auth.grants
visibility_rules:
  - Graph is primary for canonical names, aliases, customers, partners, projects, terms, decisions, stories, and RACI assignments.
  - Meeting notes, transcripts, local memory, and generated summaries are secondary evidence.
  - If Graph conflicts with secondary evidence, prefer Graph and state the conflict when it matters.
  - For Graph operations, include Brainbase Philosophy Context unless the tool explicitly disables it.
verification:
  commands:
    - curl -s -H "Authorization: Bearer $(cat ~/.brainbase/tokens.json | jq -r .access_token)" "https://bb.unson.jp/api/info/graph/entities?type=project&limit=500"
    - curl -s -H "Authorization: Bearer $(cat ~/.brainbase/tokens.json | jq -r .access_token)" "https://bb.unson.jp/api/info/context?project=brainbase&types=project&includePhilosophy=true&scope=graph"
  expected:
    - The relevant entity exists in Graph or the absence is explicitly reported.
    - Aliases are checked when matching names from user text or secondary records.
    - Philosophy Context is available before Graph mutation or interpretation.
common_failures:
  - Trusting meeting-note spellings over Graph aliases.
  - Treating search query filters as proof without checking the returned record body.
  - Mutating Graph without checking Philosophy Context.
runbooks:
  - ../runbooks/graph-ssot-lookup.md
troubleshooting:
  - ../troubleshooting/graph-secondary-source-conflict.md
