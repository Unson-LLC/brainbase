id: vibepro.impact-review
name: VibePro impact review
purpose: Use VibePro or Graphify only when dependency information can change the implementation or affected-test decision.
surfaces:
  ui:
    - Agent implementation and review responses
  api:
    - Optional VibePro CLI graph and diagnose commands
  code:
    - .claude/skills/vibepro-workflow/SKILL.md
  data:
    - Optional local Graphify output
depends_on:
  - code.reading
  - verification.testing
  - graph.ssot
visibility_rules:
  - VibePro and Graphify are optional impact-review aids, not the source of truth or merge authority.
  - Read code and affected tests directly when that is enough to choose the implementation and verification scope.
  - Do not require a PR-body section, generated artifact, score, Gate, or command transcript.
verification:
  commands:
    - Run affected tests selected from the changed behavior.
  expected:
    - Verification is proportional to the changed behavior and stated acceptance criteria.
    - Missing optional VibePro or Graphify output does not block a PR.
common_failures:
  - Collecting artifacts after the implementation and affected tests already establish the result.
  - Treating optional Graphify output as approval authority.
  - Expanding a focused change to satisfy a retired Gate.
runbooks:
  - ../runbooks/vibepro-impact-review.md
troubleshooting:
  - ../troubleshooting/vibepro-skipped-before-fix.md
