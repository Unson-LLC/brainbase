id: vibepro.impact-review
name: 改修ごとのGraphify軽量参照
purpose: Every implementation consults installed Graphify without a change-size exemption; reuse unchanged context and deepen only when evidence is insufficient.
surfaces:
  ui:
    - Agent implementation and review responses
  api:
    - node scripts/graphify-impact-context.mjs --repo <repo> --ensure-graph --file <relative-path>
  code:
    - scripts/graphify-impact-context.mjs
    - config/judgment-runtime-manifest.json
    - server/services/judgment-resolution-service.js
    - .claude/skills/vibepro-workflow/SKILL.md
  data:
    - graphify-out/graph.json
    - .vibepro/graphify/graph.json
depends_on:
  - code.reading
  - verification.testing
visibility_rules:
  - Installed Graphify receives a bounded lookup for every implementation, regardless of size.
  - Reuse requires the same repository, source state, target files, and graph content.
  - Missing, unmatched, stale, incomplete, or failed graph evidence is unknown, never no impact.
  - Graph freshness is unknown unless supported by verifiable evidence; timestamps alone are insufficient.
  - Update or deepen only when needed; do not install automatically or rebuild on every edit.
  - Generate a missing graph in the target worktree before implementation and refresh it once after implementation.
  - Graph context guides code and test selection; it is not correctness proof or merge authority.
  - Do not require a PR-body section, generated artifact, score, Gate, or command transcript.
verification:
  commands:
    - node scripts/graphify-impact-context.mjs --repo <repo> --ensure-graph --file <relative-path>
    - npm run test:run -- tests/unit/graphify-impact-context.test.js tests/unit/judgment-resolution-service.test.js
  expected:
    - Engineering implementation selects observe -> graphify-impact -> hypothesis.
    - Other intents retain the existing engineering DAG without a mandatory lookup.
    - Repeated identical lookups reuse results and source or graph changes invalidate them.
    - Unknown or truncated context never becomes a claim of no impact.
common_failures:
  - Skipping a lookup merely because the change is small.
  - Rebuilding on every edit or repeating identical lookups.
  - Treating graph presence or a successful command as fresh complete evidence.
  - Expanding a focused change to satisfy a retired Gate.
runbooks:
  - ../runbooks/vibepro-impact-review.md
troubleshooting:
  - ../troubleshooting/vibepro-skipped-before-fix.md
