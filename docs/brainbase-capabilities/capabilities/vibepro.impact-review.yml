id: vibepro.impact-review
name: VibePro Graphify impact review
purpose: Ensure graph-sensitive Brainbase changes use VibePro/Graphify to identify affected code paths, record evidence, and select focused verification before implementation is claimed complete.
surfaces:
  ui:
    - Agent implementation and review responses
    - Pull request body Graphify Impact Review section
  api:
    - VibePro CLI status, story, graph, diagnose commands
    - GitHub pull request checks
  code:
    - scripts/vibepro-graphify-impact-gate.mjs
    - tests/unit/vibepro-graphify-impact-gate.test.js
    - .claude/skills/vibepro-workflow/SKILL.md
  data:
    - .vibepro/graphify/graph.json
    - docs/session-activity-indicator-lifecycle.md
    - docs/brainbase-capabilities/
depends_on:
  - code.reading
  - verification.testing
  - graph.ssot
visibility_rules:
  - VibePro and Graphify are validation and impact-review aids, not the source of truth.
  - Capability records, implementation files, tests, runtime APIs, and logs remain the source of truth.
  - Graph-sensitive changes require a PR body section titled "Graphify Impact Review".
  - Generic VibePro diagnose output is not enough when the change depends on runtime state-machine or realtime UI relationships.
  - A selected or newly created VibePro story should be recorded when the work is part of a repeated issue stream.
verification:
  commands:
    - vibepro status . --json
    - vibepro story select . --id <story-id>
    - vibepro graph . --run-graphify
    - node scripts/vibepro-graphify-impact-gate.mjs --changed-file <path> --pr-body <body>
  expected:
    - The changed graph-sensitive files are listed before implementation or PR completion.
    - The PR body contains Graphify Impact Review evidence with a VibePro or graphify command.
    - Targeted contract tests or runtime checks are selected from the impacted path, not from memory alone.
    - The Graphify impact gate fails with a pointer to this capability when evidence is missing.
common_failures:
  - Patching graph-sensitive state-machine code before running Graphify.
  - Running VibePro diagnose but skipping `vibepro graph . --run-graphify`.
  - Forgetting to select or create the relevant VibePro story.
  - Writing PR evidence that says Graphify was used without command or artifact evidence.
  - Treating VibePro output as authoritative over code, tests, API responses, or Capability Map records.
runbooks:
  - ../runbooks/vibepro-impact-review.md
troubleshooting:
  - ../troubleshooting/vibepro-skipped-before-fix.md
