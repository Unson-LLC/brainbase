id: secrets.infisical
name: Infisical secret management
purpose: 法人別Org分離でsecretを管理し、CI/CD・runtime・local devへの注入経路を統制する
surfaces:
  ui:
    - https://infisical.unson.jp
  api:
    - GET /api/v1/organization
    - POST /api/v3/auth/select-organization
    - POST /api/v2/organizations
    - PATCH /api/v1/organization/{id}
    - POST /api/v2/workspace
    - PATCH /api/v1/workspace/{id}
    - DELETE /api/v1/workspace/{id}
    - GET /api/v3/secrets/raw
    - POST /api/v3/secrets/batch/raw
    - POST /api/v1/folders
    - GET /api/v2/organizations/{id}/memberships
    - POST /api/v1/invite-org/signup
  code:
    - .claude/skills/brainbase-infisical-env-management/SKILL.md
    - ~/.infisical/infisical-config.json
    - ~/.local/bin/infisical
  data:
    - Lightsail brainbase-nocodb (176.34.20.239)
    - /opt/infisical (server compose root)
    - ~/.brainbase/infisical/brainbase-nocodb.env (bootstrap backup)
    - /opt/infisical/secrets-inventory.md (server inventory)
depends_on:
  - Lightsail brainbase-nocodb instance
  - Org JWT scope (cross-org operations require select-organization)
  - ENCRYPTION_KEY (offline backup, cannot be managed inside Infisical)
visibility_rules:
  - Org分離: Unson / TechKnight / SalesTailor の3 Org（2026-05-02分離）
  - joint案件はGitHub/インフラの法人主体のOrgへ配置（SalesTailor=ST、Aitle=TK、MyWa=Unson、BAAO=Unson同居）
  - secret値は端末・ログ・docs・git diff・標準出力に出さない
  - importファイルは chmod 600、移行後は上書き+削除
  - JWT scopeは1つのOrgに固定。他Orgのproject/secretは select-organization で再scopeしないと見えない
verification:
  commands:
    - ~/.local/bin/infisical user get token --plain | head -c 5
    - 'curl -sS -H "Authorization: Bearer $JWT" https://infisical.unson.jp/api/v1/organization | jq ".organizations[].name"'
    - 'curl -sS -H "Authorization: Bearer $SCOPED" "https://infisical.unson.jp/api/v3/secrets/raw?workspaceId=$ID&environment=$ENV" | jq ".secrets | length"'
  expected:
    - 3 Org返る (Unson / TechKnight / SalesTailor)
    - JWT scopeで他Orgのproject見えない
    - 移行後は source と target の SHA256(sorted "key=value") が一致
common_failures:
  - '"User session is stale, please re-authenticate" → infisical login 再実行（Mac本体推奨、ttyd経由はbrowser callback失敗）'
  - 403 "Project delete protection is enabled" → PATCH で hasDeleteProtection を false にしてから DELETE
  - 403 "token is scoped to organization X but resource belongs to Y" → select-organization で対象Orgへ再scope
  - 招待API 422 "inviteeEmails Required" → body shape が `{inviteeEmails:[...], organizationId, organizationRoleSlug}`
  - 旧project ID への直書き参照（GitHub Actions / Vercel env）が削除後の deploy/CI で 404
runbooks:
  - ../runbooks/infisical-org-create.md
  - ../runbooks/infisical-secret-migrate.md
troubleshooting:
  - ../troubleshooting/infisical-stale-session.md
  - ../troubleshooting/infisical-delete-protection.md
